<!--
  ═══════════════════════════════════════════════════════════════════════════
  COFFEE BACKLOG — standalone build.

  One file. Open it from a URL and it works; there is no server, no account,
  and nothing leaves the machine it is opened on. Everything a visitor logs is
  written to that browser's localStorage under three keys: coffee-bags,
  coffee-brews, coffee-cabinet.

  HOW THIS IS PUT TOGETHER
  React and ReactDOM load from a CDN as globals. The app below is JSX and is
  compiled in the browser by Babel Standalone at load, which is why the whole
  thing stays editable as plain text: you can open this file, change a string,
  and reload. The cost is a ~0.5s compile on every page load. If that ever
  matters more than editability, the JSX can be precompiled ahead of time and
  Babel dropped entirely.

  SERVE IT OVER HTTP, NOT file://
  Chrome gives file:// pages an opaque origin and localStorage behaves
  erratically or gets discarded — which defeats the entire point. Any static
  host works: Netlify Drop, GitHub Pages, Cloudflare Pages.
  ═══════════════════════════════════════════════════════════════════════════
-->

  <strong>This page needs to reach a CDN and it couldn't.</strong><br>
  React and Babel are loaded from unpkg.com. If you are offline, or a network
  blocks it, the app can't start. Your saved data is untouched — it is in this

  </div>

<script>
  // If the CDN never arrives, say so instead of leaving "Loading…" forever.
  window.addEventListener("load", function () {
    if (!window.React || !window.ReactDOM || !window.Babel) {
      var root = document.getElementById("root");
      if (root) root.style.display = "none";
      document.getElementById("boot-fail").style.display = "block";
    }
  });
</script>

<script type="text/babel" data-presets="react">
// ═══════════════════════════════════════════════════════════════════════════
// COFFEE BACKLOG — bag inventory, brew log, and equipment cabinet.
// Single-file React artifact. Runs inside a Claude artifact only (see STORAGE).
//
// ── HOUSE RULES (follow these when adding anything) ───────────────────────
// 1. VERTICAL STRETCH. Press Start 2P is drawn on a square grid and reads
//    squat at native proportions. EVERY new heading, title, section label or
//    arcade-font button gets `transform: scaleY(...)` of AT LEAST 1.2 — use
//    D.stretch. Do NOT stretch body copy, secondary detail lines, helper text,
//    field labels, or data values. This is a standing preference, not a
//    one-off: a new heading added later without a stretch is a bug.
// 2. TYPE PAIRING. Press Start 2P for display/headings/buttons only. VT323 for
//    everything else. No third font.
// 3. CORNERS. Square everywhere, on purpose — it is the 8-bit read. The only
//    rounded things are the folder tabs, the folder body, and the New/Data
//    buttons (D.folder). Do not "tidy up" other corners with a radius.
// 4. SHADOWS. Hard offset blocks (`4px 4px 0 <ink>`), never blurred.
// 5. CARD GRID IS A SOLVED EQUATION, not a guess. See D.card. Changing the
//    column count or card width without re-solving the others clips the cards.
// 6. FIXED CARD HEIGHTS. Backlog cards are a fixed height with a fixed-height
//    face block; that is what keeps the dashed divider from moving card to
//    card. Long text truncates with an ellipsis rather than wrapping — do not
//    "fix" that by letting cards grow.
// 7. DETAIL LIVES IN POPUPS, not in expanding cards. Both the backlog and brew
//    tabs deliberately moved away from inline expansion.
// 8. SAVES ARE OPTIMISTIC. Update state and close the modal immediately; the
//    storage write happens in the background. Never await it in a handler.
//
// ── STORAGE ──────────────────────────────────────────────────────────────
// Persistence uses `localStorage` through the `storage` adapter defined below.
// Keys: "coffee-bags", "coffee-brews", "coffee-cabinet".
//
// Data is per-browser-profile and per-origin. Two people opening the same link
// get two separate logs; the same person in Chrome and Safari also gets two.
// Nothing is ever sent anywhere. The in-app Data button is the ONLY way to move
// a log between browsers, devices or copies of this file.
//
// NOTE: this build no longer runs as a Claude artifact — the artifact sandbox
// forbids localStorage. Iterate on the artifact version if you need the live
// preview, and treat this file as the shipping build.
//
// ── EDITING THIS FILE ────────────────────────────────────────────────────
// It is long (~1500 lines) and lives inside the <script type="text/babel">
// block of coffee-backlog.html. Prefer targeted string edits over regenerating
// the whole thing; a full rewrite risks silently dropping features. After any
// edit, re-check that the numbers in D are still referenced rather than
// re-inlined.
// ═══════════════════════════════════════════════════════════════════════════

const { useState, useEffect, useRef } = React;

// ═══════════════════════════════════════════════════════════════════
// STORAGE ADAPTER
// Mirrors the shape of the Claude-artifact `window.storage` API so the call
// sites below are unchanged: get() returns {key, value} or null, set() returns
// {key, value}. Both are synchronous, which is harmless — awaiting a plain
// value is legal, so the existing `await` and .catch() patterns still hold.
//
// Every method is wrapped: Safari in Private Browsing throws on setItem rather
// than failing quietly, and a disabled-cookies setting makes localStorage
// itself unreachable. A throw here surfaces as the app's normal save-error
// banner instead of a white screen.
// ═══════════════════════════════════════════════════════════════════
const storage = {
  get(key) {
    const value = localStorage.getItem(key);
    return value === null ? null : { key, value };
  },
  // set() MUST return a promise, not a plain value. The save handlers wrap it in
  // `Promise.resolve(...).catch(...)`; if setItem threw synchronously the throw
  // would happen while evaluating the argument, before Promise.resolve ever ran,
  // so the .catch() would never fire and the handler would blow up instead of
  // showing the save-error banner. Returning a rejected promise routes the
  // failure back into the path the app already has for it.
  set(key, value) {
    try {
      localStorage.setItem(key, value);
      return Promise.resolve({ key, value });
    } catch (e) {
      return Promise.reject(e);
    }
  },
};

// ————— Design tokens: "cupping lab logbook" —————

// ═══════════════════════════════════════════════════════════════════
// DESIGN TOKENS — every number here was tuned by eye, not guessed.
// Change values here rather than inline, and keep the relationships noted below.
// ═══════════════════════════════════════════════════════════════════
const D = {
  // Press Start 2P is drawn on a square grid, so display text reads squat unless
  // stretched vertically. Anything that acts as a heading gets at least 1.2.
  // Body copy, secondary detail lines and helper text are never stretched.
  stretch: {
    pageTitle: 1.2,      // THE BACKLOG / THE BREW LOG / THE CABINET
    cardTitle: 1.4,      // roaster names, brew method label
    heading: 1.2,        // section headings, modal titles
    button: 1.2,         // all arcade-font buttons and tabs
  },

  // Card grid. The folder interior is exactly wide enough for one row:
  //   1080 page − 4 border − 44 padding = 1032
  //   4 × 246 + 3 × 16                  = 1032
  // Changing any one of these means re-solving the others or the cards clip.
  card: {
    width: 246,
    height: 172,         // fixed, so the dashed divider never moves between cards
    archivedHeight: 138, // archived cards drop the weight line and the RESTED row, so they sit shorter
    faceHeight: 96,      // the top block; fixing this is what pins the divider
    archivedFaceHeight: 80, // one fewer detail line (no weight) on archived cards
    gap: 16,
    // The grid is `auto-fill, minmax(min(100%, width), 1fr)`, so `columns` is no
    // longer a hard count — it is what the folder fits at full desktop width
    // (1032 / 246+16). Below 1080 the grid drops to 3, 2 then 1 column on its own.
    columns: 4,
    padding: "11px 14px",
  },

  cabinetCardMinHeight: 58,

  // Folder chrome
  folder: {
    radius: 10,          // folder body corners
    tabRadius: 9,        // tab tops and the New/Data buttons
    border: 2,
    overlap: -4,         // how far tabs tuck behind each other
    btnShadow: 3,        // hard offset under the New button. Doubles as its right
                         // inset, so the shadow stops ON the folder's right outline
                         // rather than hanging past it.
  },

  page: { maxWidth: 1080, padding: 22 },

  // Optical corrections. Each of these was arrived at by looking at the screen,
  // not by calculation — if you change a font size or a stretch value nearby,
  // re-check the one that pairs with it rather than assuming it still holds.
  micro: {
    countLineIndent: 5,     // VT323 starts inside its box; Press Start 2P doesn't,
                            // so the subtitle needs pushing right to look flush
    methodIconLift: -3,     // the pourover cone sits low in its 12x12 grid
    dividerGapTop: 2,       // above the dashed rule; below it is 7px of padding

    restedIndent: 0,        // RESTED sits flush under ROASTED
  },

  // Flags render at one size everywhere; the roaster flag is 1.5x with a manual
  // 4px drop because the 1.4 text stretch shifts the optical centre down.
  // That drop is ONLY correct where the roaster name stretches from `left top`
  // (the backlog card), which grows the glyphs downward and pushes their optical
  // centre below the layout box flex centres on. Where the name stretches from
  // `center` (the bag and brew popups) the centre does not move, so those flags
  // take no nudge at all — adding one just parks them below the text.
  flag: { size: 16, roasterScale: 1.5, roasterNudge: 4 },
};

const FONTS = `

// ————— 8-bit date picker, housed in a little manila folder —————
const DOW = ["S", "M", "T", "W", "T", "F", "S"];

function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function PixelCalendar({ value, onPick, onClose }) {
  const initial = value ? new Date(value + "T00:00:00") : new Date();
  const [view, setView] = useState(new Date(initial.getFullYear(), initial.getMonth(), 1));
  const today = ymd(new Date());

  const month = view.getMonth();

    transformOrigin: "center",
  };

  return (
    <div style={{ position: "absolute", top: "calc(100% + 10px)", left: 0, zIndex: 60, width: 236 }}>
      {/* folder tab */}
      <div
        style={{
          width: 74,

          background: T.card,
          border: `2px solid ${T.ink}`,

      />
      {/* folder body */}
      <div
        style={{
          background: T.card,
          border: `2px solid ${T.ink}`,
          borderRadius: "0 8px 8px 8px",
          padding: 10,
          marginTop: -2,
          boxShadow: `5px 5px 0 rgba(43,33,24,0.45)`,
        }}
      >
        {/* month bar */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 6, marginBottom: 9 }}>
          <button type="button" onClick={() => shift(-1)} style={navBtn}>{"<"}</button>
          <span
            style={{
              fontFamily: "'Press Start 2P', monospace",
              fontSize: 9,
              color: T.ink,
              transform: `scaleY(${D.stretch.button})`,
              transformOrigin: "center",
              display: "inline-block",
            }}
          >
            {MONTHS_SHORT[month]} {year}
          </span>
          <button type="button" onClick={() => shift(1)} style={navBtn}>{">"}</button>
        </div>

        {/* weekday header */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: 3 }}>
          {DOW.map((d, i) => (
            <span
              key={i}
              style={{
                textAlign: "center",
                fontFamily: "'VT323', monospace",
                fontSize: 14,
                color: T.bean,
                letterSpacing: "0.04em",
              }}
            >
              {d}
            </span>
          ))}
        </div>

        {/* day grid */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2 }}>
          {cells.map((day, i) => {
            if (day === null) return <span key={i} />;
            const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            const selected = value === iso;
            const isToday = today === iso;
            const future = iso > today;
            return (
              <button
                key={i}
                type="button"
                onClick={() => { onPick(iso); onClose(); }}
                style={{
                  aspectRatio: "1 / 1",
                  background: selected ? T.bean : "transparent",
                  border: `1px solid ${selected ? T.bean : isToday ? T.rust : "transparent"}`,
                  borderRadius: 0,
                  color: selected ? T.card : future ? T.line : T.ink,
                  cursor: "pointer",
                  fontFamily: "'VT323', monospace",
                  fontSize: 16,

}

// Processing names run long and would wrap the fixed-height card face,
// pushing the weight line out of view. Abbreviate for cards; popups show the full name.
const PROCESS_ABBR = [
  [/triple\s+fermentation/gi, "Tri Ferm."],
  [/double\s+fermentation/gi, "Dbl Ferm."],
  [/thermal\s+shock/gi, "Therm-S."],
  [/carbonic\s+maceration/gi, "Carb. Mac."],
  [/anaerobic/gi, "An."],
  [/fermentation|fermented/gi, "Ferm."],
  [/experimental/gi, "Exp."],
  [/yeast\s+inoculated/gi, "Yeast Inoc."],
  [/extended/gi, "Ext."],
  [/swiss\s+water/gi, "SW"],
  [/wet[-\s]?hulled/gi, "Wet-Hull."],
  [/maceration/gi, "Mac."],
  [/washed/gi, "Washed"],
];

function shortProcess(raw) {
  if (!raw) return "";
  let out = raw.trim();
  PROCESS_ABBR.forEach(([re, rep]) => { out = out.replace(re, rep); });
  return out.replace(/\s+/g, " ").trim();
}

const EMPTY_FORM = {

function daysSince(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d)) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

// Weight is always displayed in grams. Accepts g, kg, oz, lb (and bare numbers, read as grams).
const G_PER = { g: 1, gram: 1, grams: 1, gr: 1, kg: 1000, kilo: 1000, kilos: 1000, kilogram: 1000, kilograms: 1000,
  oz: 28.3495, ounce: 28.3495, ounces: 28.3495, lb: 453.592, lbs: 453.592, pound: 453.592, pounds: 453.592 };

function toGrams(raw) {
  if (!raw) return null;
  const m = String(raw).trim().toLowerCase().replace(",", ".").match(/^([\d.]+)\s*([a-z]*)\.?$/);
  if (!m) return null;
  const value = parseFloat(m[1]);
  if (!isFinite(value)) return null;
  const unit = m[2] || "g"; // bare number means grams
  const factor = G_PER[unit];
  return factor ? value * factor : null;
}

// Grams left in a bag = what was logged, minus every dose brewed from it.
// Derived rather than stored, so deleting a brew puts the coffee back.
function gramsUsed(bagId, brews) {
  return brews.reduce((sum, x) => (x.bagId === bagId && x.recipe ? sum + (parseFloat(x.recipe.dose) || 0) : sum), 0);
}

function remainingGrams(bag, brews) {
  const start = toGrams(bag.weight);
  if (start === null) return null;
  return Math.max(0, start - gramsUsed(bag.id, brews));
}

function formatWeight(raw) {
  const g = toGrams(raw);
  if (g === null) return raw || "";       // unparseable: show exactly what was typed
  return `${Math.round(g)} g`;
}

// ————— Tasting radar (categories from the flavour wheel, UI after the French cupping chart) —————
const TASTE_AXES = [
  "Stone Fruit", "Citrus Fruit", "Berry Fruit", "Tropical Fruit", "Funk", "Body",
  "Tea", "Herbal", "Floral", "Spice", "Sweetness", "Acidity",
];

const EMPTY_TASTING = TASTE_AXES.reduce((acc, k) => ({ ...acc, [k]: 0 }), {});

// The "Funky" axis was renamed to "Funk". Tasting scores are keyed by axis name,
// so a review saved before the rename still carries its score under "Funky" and
// would read as 0 on the radar. Move it across on load and on import; a brew that
// somehow has both keys keeps the newer one.
function migrateBrews(list) {
  return (list || []).map((b) => {
    if (!b || !b.tasting || !("Funky" in b.tasting)) return b;
    const { Funky, ...rest } = b.tasting;
    return { ...b, tasting: { ...rest, Funk: rest.Funk != null ? rest.Funk : Funky } };
  });
}

// ═══════════════════════════════════════════════════════════════════
// AUTO-SAVE TO A LOCAL FILE
// A page cannot write to a path on its own — browsers forbid it. The File
// System Access API is the one exception: the user hands the page ONE file
// through a native dialog, and from then on the page may rewrite that exact
// file silently. Chromium only (Chrome/Edge); Safari and Firefox have nothing
// equivalent, which is why the copy/paste box above stays the universal path.
//
// The handle itself is structured-cloneable, so it goes in IndexedDB and the
// link survives a reload. The PERMISSION does not survive — Chrome downgrades
// it to "prompt" on a fresh page load — so a returning visit needs one click
// to resume. That is a browser rule, not something the app can opt out of.
// ═══════════════════════════════════════════════════════════════════
const AUTOSAVE_DB = "coffee-backlog-autosave";
const AUTOSAVE_STORE = "handles";
const AUTOSAVE_KEY = "backup-file";

// Embedded (an artifact iframe, say) means no file picker — the sandbox blocks it.
function autosaveBlocked() {
  try { return window.self !== window.top; } catch (e) { return true; }
}

function autosaveSupported() {
  return typeof window !== "undefined" && typeof window.showSaveFilePicker === "function" && !autosaveBlocked();
}

function autosaveDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(AUTOSAVE_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(AUTOSAVE_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function autosaveGetHandle() {
  return autosaveDB().then((db) => new Promise((resolve, reject) => {
    const r = db.transaction(AUTOSAVE_STORE, "readonly").objectStore(AUTOSAVE_STORE).get(AUTOSAVE_KEY);
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  }));
}

function autosavePutHandle(handle) {
  return autosaveDB().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(AUTOSAVE_STORE, "readwrite");
    tx.objectStore(AUTOSAVE_STORE).put(handle, AUTOSAVE_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

function autosaveClearHandle() {
  return autosaveDB().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(AUTOSAVE_STORE, "readwrite");
    tx.objectStore(AUTOSAVE_STORE).delete(AUTOSAVE_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}


const RADAR = { vbW: 710, vbH: 560, cx: 355, cy: 284, r: 178, max: 5 };

function axisPoint(i, value) {
  const angle = (-90 + i * (360 / TASTE_AXES.length)) * (Math.PI / 180);
  const dist = (value / RADAR.max) * RADAR.r;
  return [RADAR.cx + Math.cos(angle) * dist, RADAR.cy + Math.sin(angle) * dist];
}

function ringPath(level) {
  return TASTE_AXES.map((_, i) => axisPoint(i, level).join(",")).join(" ");
}

function TastingRadar({ scores, onChange }) {
  const svgRef = useRef(null);
  const [dragging, setDragging] = useState(null);
  const [selected, setSelected] = useState(0);

  useEffect(() => { svgRef.current?.focus(); }, []);

  const bump = (delta) => {
    const axis = TASTE_AXES[selected];
    const next = Math.min(RADAR.max, Math.max(0, (scores[axis] || 0) + delta));
    onChange({ ...scores, [axis]: Math.round(next * 2) / 2 });
  };

  const onKeyDown = (e) => {
    const n = TASTE_AXES.length;
    if (e.key === "ArrowRight") { setSelected((i) => (i + 1) % n); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { setSelected((i) => (i - 1 + n) % n); e.preventDefault(); }
    else if (e.key === "ArrowUp") { bump(e.shiftKey ? 1 : 0.5); e.preventDefault(); }
    else if (e.key === "ArrowDown") { bump(e.shiftKey ? -1 : -0.5); e.preventDefault(); }
    else if (e.key === "Home") { onChange({ ...scores, [TASTE_AXES[selected]]: 0 }); e.preventDefault(); }
    else if (e.key === "End") { onChange({ ...scores, [TASTE_AXES[selected]]: RADAR.max }); e.preventDefault(); }
  };

  const valueFromEvent = (i, e) => {
    const svg = svgRef.current;
    if (!svg) return null;
    const rect = svg.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * RADAR.vbW;
    const y = ((e.clientY - rect.top) / rect.height) * RADAR.vbH;
    const angle = (-90 + i * (360 / TASTE_AXES.length)) * (Math.PI / 180);
    // project the pointer onto this axis so dragging stays on-rail
    const proj = (x - RADAR.cx) * Math.cos(angle) + (y - RADAR.cy) * Math.sin(angle);
    const raw = (proj / RADAR.r) * RADAR.max;
    return Math.min(RADAR.max, Math.max(0, Math.round(raw * 2) / 2)); // 0.5 steps
  };

  const apply = (i, e) => {
    const v = valueFromEvent(i, e);
    if (v !== null) onChange({ ...scores, [TASTE_AXES[i]]: v });
  };

  const total = TASTE_AXES.reduce((sum, k) => sum + (scores[k] || 0), 0);

  return (
    <div>
      <svg
        ref={svgRef}
        viewBox={`0 0 ${RADAR.vbW} ${RADAR.vbH}`}
        tabIndex={0}
        onKeyDown={onKeyDown}
        style={{ width: "100%", height: "auto", touchAction: "none", display: "block", outline: "none" }}
        onPointerMove={(e) => { if (dragging !== null) apply(dragging, e); }}
        onPointerUp={() => setDragging(null)}
        onPointerLeave={() => setDragging(null)}
      >
        {/* concentric rings */}
        {[1, 2, 3, 4, 5].map((lvl) => (
          <polygon key={lvl} points={ringPath(lvl)} fill="none" stroke="#D8D3C4" strokeWidth="1" />
        ))}

        {/* spokes + diamond ring markers */}
        {TASTE_AXES.map((axis, i) => {
          const [ex, ey] = axisPoint(i, RADAR.max);
          return (
            <g key={axis}>
              <line x1={RADAR.cx} y1={RADAR.cy} x2={ex} y2={ey} stroke="#D8D3C4" strokeWidth="1" />
              {[1, 2, 3, 4, 5].map((lvl) => {
                const [mx, my] = axisPoint(i, lvl);
                return <rect key={lvl} x={mx - 2.5} y={my - 2.5} width="5" height="5" fill="#C9C3B2" transform={`rotate(45 ${mx} ${my})`} />;
              })}
            </g>
          );
        })}

        {/* the trace */}
        <polygon
          points={TASTE_AXES.map((k, i) => axisPoint(i, scores[k] || 0).join(",")).join(" ")}
          fill="#9C4A1A"
          fillOpacity="0.14"
          stroke="#9C4A1A"
          strokeWidth="3.5"
          strokeLinejoin="round"
        />

        {/* scale numbers up the top axis */}
        {[0, 1, 2, 3, 4, 5].map((lvl) => {
          const [, ly] = axisPoint(0, lvl);
          return (
            <text key={lvl} x={RADAR.cx - 9} y={ly + 5} textAnchor="end" fontFamily="'VT323', monospace" fontSize="17" fill="#8F8676">
              {lvl}
            </text>
          );
        })}

        {/* wide invisible hit-rails + draggable handles */}
        {TASTE_AXES.map((axis, i) => {
          const [ex, ey] = axisPoint(i, RADAR.max);
          const [hx, hy] = axisPoint(i, scores[axis] || 0);
          const [rx, ry] = axisPoint(i, 0.55); // rails begin outside the crowded hub
          return (
            <g key={`h-${axis}`}>
              <line
                x1={rx} y1={ry} x2={ex} y2={ey}
                stroke="transparent" strokeWidth="30" strokeLinecap="butt" style={{ cursor: "pointer" }}
                onPointerDown={(e) => { e.currentTarget.releasePointerCapture?.(e.pointerId); setSelected(i); setDragging(i); apply(i, e); }}
              />
              <circle
                cx={hx} cy={hy} r={dragging === i ? 10 : selected === i ? 9 : 7}
                fill={dragging === i ? "#55632A" : "#9C4A1A"}
                stroke={selected === i ? "#55632A" : "#F7F5EE"} strokeWidth={selected === i ? 3 : 2}
                style={{ cursor: "grab" }}
                onPointerDown={(e) => { setSelected(i); setDragging(i); }}
              />
            </g>
          );
        })}

        {/* axis labels */}
        {TASTE_AXES.map((axis, i) => {
          const angle = (-90 + i * (360 / TASTE_AXES.length)) * (Math.PI / 180);
          const lx = RADAR.cx + Math.cos(angle) * (RADAR.r + 34);
          const ly = RADAR.cy + Math.sin(angle) * (RADAR.r + 34);
          const anchor = Math.abs(Math.cos(angle)) < 0.25 ? "middle" : Math.cos(angle) > 0 ? "start" : "end";
          const val = scores[axis] || 0;
          const isSel = selected === i;
          const size = isSel ? 25 : 19;
          // stack multi-word labels so long ones don't run off the canvas
          const words = axis.split(" ");
          const lines = words.length > 1 && Math.abs(Math.cos(angle)) > 0.25 ? words : [axis];
          const lineH = size + 2;
          const top = ly - ((lines.length - 1) * lineH) / 2;
          return (
            <g key={`l-${axis}`}>
              <text
                x={lx}
                y={top}
                textAnchor={anchor}
                fontFamily="'VT323', monospace"
                fontSize={size}
                letterSpacing={isSel ? "0.1em" : "0.06em"}
                fill={isSel ? "#55632A" : "#2B2118"}
                stroke={isSel ? "#55632A" : "none"}
                strokeWidth={isSel ? 0.9 : 0}
                paintOrder="stroke"
              >
                {lines.map((ln, li) => (
                  <tspan key={li} x={lx} dy={li === 0 ? 0 : lineH}>
                    {isSel && li === 0 ? `> ${ln}` : ln}
                  </tspan>
                ))}
              </text>
              <text
                x={lx}
                y={top + (lines.length - 1) * lineH + (isSel ? 21 : 15)}
                textAnchor={anchor}
                fontFamily="'VT323', monospace"
                fontSize={isSel ? 21 : 16}
                fill={isSel || val > 0 ? "#9C4A1A" : "#8F8676"}
                stroke={isSel ? "#9C4A1A" : "none"}
                strokeWidth={isSel ? 0.7 : 0}
                paintOrder="stroke"
              >
                {val.toFixed(1)}
              </text>
            </g>
          );
        })}
      </svg>
      <p style={{ fontSize: 16, color: "#8F8676", textAlign: "center", margin: "4px 0 0", letterSpacing: "0.04em" }}>
        Drag or tap a spoke · ← → pick axis, ↑ ↓ adjust (shift = 1.0) · total {total.toFixed(1)}
      </p>
    </div>
  );
}

function MiniRadar({ scores }) {

  const pt = (i, v) => {
    const a = (-90 + i * (360 / TASTE_AXES.length)) * (Math.PI / 180);

const num = (v) => {
  const n = parseFloat(v);
  return isFinite(n) ? n : null;
};

// Editing any one of dose / ratio / water re-derives the other two.
function recalcRecipe(recipe, key, value) {
  const next = { ...recipe, [key]: value };
  const dose = num(next.dose), ratio = num(next.ratio), water = num(next.water);
  if (key === "dose" || key === "ratio") {
    if (dose && ratio) next.water = String(Math.round(dose * ratio));
  } else if (key === "water") {
    if (dose && water) next.ratio = String(Math.round((water / dose) * 10) / 10);
  }
  return next;
}

function fmtSeconds(total) {
  const t = num(total);
  if (t === null) return "";
  const m = Math.floor(t / 60), sec = Math.round(t % 60);
  return `${m}:${String(sec).padStart(2, "0")}`;
}

// RESPONSIVE SWITCH
// Everything here is styled inline, and an inline style beats any media-query
// rule short of !important. So the breakpoint lives in JS and the styles branch
// on it — one source of truth per value instead of a specificity war.
//
// 1080 is not arbitrary: it is D.page.maxWidth, the width at which the folder
// still fits its full four-column grid. Below that the layout has to give.
// ═══════════════════════════════════════════════════════════════════
const NARROW_QUERY = "(max-width: 1079px)";

function useNarrow() {
  const read = () =>
    typeof window !== "undefined" && window.matchMedia ? window.matchMedia(NARROW_QUERY).matches : false;
  const [narrow, setNarrow] = useState(read);
  useEffect(() => {
    if (typeof window === "undefined" || !window.matchMedia) return;
    const mq = window.matchMedia(NARROW_QUERY);
    const onChange = (e) => setNarrow(e.matches);
    setNarrow(mq.matches);                    // catch a resize between first paint and here
    // Safari below 14 only has the deprecated addListener/removeListener pair.
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else mq.addListener(onChange);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", onChange);
      else mq.removeListener(onChange);
    };
  }, []);
  return narrow;
}

// Days between roast date and the moment it was brewed
function restedAt(roastDate, brewedAt) {
  if (!roastDate) return "—";
  const d = new Date(roastDate + "T00:00:00");
  if (isNaN(d)) return "—";
  const days = Math.floor((new Date(brewedAt).getTime() - d.getTime()) / 86400000);
  return days < 0 ? "—" : `${days}d`;
}

}

// Every flag in the UI renders at this size, regardless of the text it sits beside
const FLAG_SIZE = D.flag.size;

function Flag({ country, nudge = 0, size = FLAG_SIZE }) {
  const glyph = flagFor(country);
  if (!glyph) return null;
  return (
    <span
      title={country}
      style={{ fontSize: size, lineHeight: "13px", letterSpacing: "normal", display: "inline-block", verticalAlign: "middle", flexShrink: 0, position: "relative", top: nudge }}
    >
      {glyph}
    </span>
  );
}

// Longest keys first, so "south korea" wins over "korea" and "papua new guinea" over "guinea"
const FLAG_KEYS = Object.keys(FLAGS).sort((a, b) => b.length - a.length);

function flagFor(country) {
  if (!country) return "";
  const key = country.trim().toLowerCase().replace(/\s+/g, " ");
  if (FLAGS[key]) return FLAGS[key];
  // Loose match on whole words, so "Melbourne, Australia" or "Ethiopia (Guji)" resolve
  // without short codes like "us" matching inside words such as "australia".
  const hit = FLAG_KEYS.find((k) => new RegExp(`(^|[^a-z])${k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}($|[^a-z])`).test(key));
  return hit ? FLAGS[hit] : "";
}
