  const [gear, setGear] = useState([]);
  const [showGearModal, setShowGearModal] = useState(false);
  const [gearForm, setGearForm] = useState({ name: "", detail: "", type: "brewer" });
  const [gearEditId, setGearEditId] = useState(null);
  const [brewDetail, setBrewDetail] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [calOpen, setCalOpen] = useState(false);
  const [showData, setShowData] = useState(false);
  const [importText, setImportText] = useState("");
  const [importMsg, setImportMsg] = useState(null);
  const [autoFile, setAutoFile] = useState(null);        // FileSystemFileHandle, or null
  const [autoState, setAutoState] = useState("off");    // off | ready | needs-permission | unsupported | embedded | error
  const [autoMsg, setAutoMsg] = useState("");
  const [autoSavedAt, setAutoSavedAt] = useState(null);
  const [tab, setTab] = useState("backlog");
  const [brews, setBrews] = useState([]);
  const [showBrewModal, setShowBrewModal] = useState(false);
  const [brewPick, setBrewPick] = useState(null);
  const [brewStep, setBrewStep] = useState(1);
  const [brewMethod, setBrewMethod] = useState(null);
  const [recipe, setRecipe] = useState(EMPTY_RECIPE);
  const [loggedBrewId, setLoggedBrewId] = useState(null);
  const [tasting, setTasting] = useState(EMPTY_TASTING);
  const [notes, setNotes] = useState("");

  const narrow = useNarrow();
  // True when the review flow was reopened on an existing brew rather than reached
  // straight after logging one — only the wording on the picker screen differs.
  const [reviewReturning, setReviewReturning] = useState(false);

  // Load saved inventory
  useEffect(() => {
    (async () => {
      try {
        const result = await storage.get("coffee-bags");
        if (result && result.value) setBags(JSON.parse(result.value));
      } catch (e) {
        // No saved bags yet — start fresh
      }
      try {
        const result = await storage.get("coffee-brews");
        if (result && result.value) {
          const saved = JSON.parse(result.value);
          const fixed = migrateBrews(saved);
          setBrews(fixed);
          if (JSON.stringify(fixed) !== JSON.stringify(saved)) {
            try { await storage.set("coffee-brews", JSON.stringify(fixed)); } catch (err) { /* non-fatal */ }
          }
        }
      } catch (e) {
        // No saved brews yet — start fresh
      }
      try {
        const result = await storage.get("coffee-cabinet");
        if (!result || !result.value) throw new Error("empty");
        const saved = JSON.parse(result.value);
        // Schema-only migration. The old build also renamed specific grinders and
        // force-added a DF64 if one was missing — those were one-off fixes for a
        // single person's data and have been removed. Left in, they would inject a
        // stranger's grinder into every cabinet saved without one.
        const fixed = saved.map(({ icon, ...g }) => {
          const next = { ...g };
          if (next.type === "dripper") next.type = "brewer";   // Dripper merged into Brewer
          return next;
        });
        setGear(fixed);
        if (JSON.stringify(fixed) !== JSON.stringify(saved)) {
          try { await storage.set("coffee-cabinet", JSON.stringify(fixed)); } catch (err) { /* non-fatal */ }
        }
      } catch (e) {
        // First run: stock the cabinet with the kit already on the shelf
        setGear(SEED_CABINET);
        try { await storage.set("coffee-cabinet", JSON.stringify(SEED_CABINET)); } catch (err) { /* non-fatal */ }
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  // Everything the app knows, in one portable blob
  const buildExport = () =>
    JSON.stringify({ format: "coffee-backlog", version: 1, exportedAt: new Date().toISOString(), bags, brews, gear }, null, 2);

  const downloadExport = () => {
    try {
      const blob = new Blob([buildExport()], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `coffee-backlog-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {
      setImportMsg({ ok: false, text: "Download blocked — copy the text instead." });
    }
  };

  // ── Auto-save: keep one chosen file in step with every change ──────────────
  const writeBackup = async (handle) => {
    const h = handle || autoFile;
    if (!h) return;
    try {
      const w = await h.createWritable();
      await w.write(buildExport());
      await w.close();
      setAutoSavedAt(new Date());
      setAutoMsg("");
    } catch (e) {
      // Permission can lapse mid-session (the file was moved, or access revoked).
      if (e && e.name === "NotAllowedError") {
        setAutoState("needs-permission");
      } else {
        setAutoState("error");
        setAutoMsg("Couldn't write to that file. Pick it again, or use the box above.");
      }
    }
  };

  // Reconnect to the file chosen in an earlier visit, if the grant is still live.
  useEffect(() => {
    if (!autosaveSupported()) {
      setAutoState(autosaveBlocked() ? "embedded" : "unsupported");
      return;
    }
    (async () => {
      try {
        const h = await autosaveGetHandle();
        if (!h) return;
        setAutoFile(h);
        const perm = await h.queryPermission({ mode: "readwrite" });
        setAutoState(perm === "granted" ? "ready" : "needs-permission");
      } catch (e) {
        // Nothing stored, or IndexedDB unavailable — stay off, the box above still works.
      }
    })();
  }, []);

  // Every change to the log rewrites the file. Debounced, because editing a
  // recipe fires a state update per keystroke and each write opens the file.
  const autoFirstRun = useRef(true);
  useEffect(() => {
    if (loading) return;
    if (autoFirstRun.current) { autoFirstRun.current = false; return; }  // loading the app is not a change
    if (autoState !== "ready" || !autoFile) return;
    const t = setTimeout(() => { writeBackup(autoFile); }, 800);
    return () => clearTimeout(t);
  }, [bags, brews, gear, autoState, autoFile, loading]);

  const chooseBackupFile = async () => {
    try {
      const h = await window.showSaveFilePicker({
        suggestedName: "coffee-backlog-data.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
      });
      setAutoFile(h);
      setAutoState("ready");
      setAutoMsg("");
      try { await autosavePutHandle(h); } catch (e) { /* non-fatal: works this session, re-pick next time */ }
      await writeBackup(h);
    } catch (e) {
      if (e && e.name === "AbortError") return;   // the picker was dismissed; nothing to report
      setAutoState("error");
      setAutoMsg("Couldn't open the file picker.");
    }
  };

  const resumeAutoSave = async () => {
    if (!autoFile) return;
    try {
      const perm = await autoFile.requestPermission({ mode: "readwrite" });
      if (perm !== "granted") { setAutoState("needs-permission"); return; }
      setAutoState("ready");
      await writeBackup(autoFile);
    } catch (e) {
      setAutoState("error");
      setAutoMsg("Couldn't get permission to write to that file.");
    }
  };

  const stopAutoSave = async () => {
    try { await autosaveClearHandle(); } catch (e) { /* non-fatal */ }
    setAutoFile(null);
    setAutoSavedAt(null);
    setAutoMsg("");
    setAutoState("off");
  };

  const runImport = (mode) => {
    let data;
    try {
      data = JSON.parse(importText);
    } catch (e) {
      setImportMsg({ ok: false, text: "That isn't valid JSON." });
      return;
    }
    if (!data || typeof data !== "object" || (!Array.isArray(data.bags) && !Array.isArray(data.brews) && !Array.isArray(data.gear))) {
      setImportMsg({ ok: false, text: "No bags, brews or cabinet found in that file." });
      return;
    }
    const inBags = Array.isArray(data.bags) ? data.bags : [];
    const inBrews = Array.isArray(data.brews) ? migrateBrews(data.brews) : [];
    const inGear = Array.isArray(data.gear) ? data.gear : [];

    if (mode === "replace") {
      persist(inBags);
      persistBrews(inBrews);
      persistGear(inGear);
      setImportMsg({ ok: true, text: `Replaced: ${inBags.length} bags, ${inBrews.length} brews, ${inGear.length} items.` });
    } else {
      // merge by id, incoming wins on a collision
      const mergeById = (mine, theirs) => {
        const map = new Map(mine.map((x) => [x.id, x]));
        theirs.forEach((x) => map.set(x.id, x));
        return [...map.values()];
      };
      const mBags = mergeById(bags, inBags);
      const mBrews = mergeById(brews, inBrews);
      const mGear = mergeById(gear, inGear);
      persist(mBags);
      persistBrews(mBrews);
      persistGear(mGear);
      setImportMsg({ ok: true, text: `Merged to ${mBags.length} bags, ${mBrews.length} brews, ${mGear.length} items.` });
    }
    setImportText("");
  };

  const persist = (next) => {
    setBags(next);                       // render at once
    setSaveError(null);
    // the write happens in the background; the UI doesn't wait on it
    Promise.resolve(storage.set("coffee-bags", JSON.stringify(next))).catch(() => {
      setSaveError("Couldn't save to storage — changes may not persist.");
    });
  };

  const saveBag = () => {
    if (!form.roaster.trim()) return;
    let next;
    if (editingId) {
      next = bags.map((b) => (b.id === editingId ? { ...b, ...form } : b));
    } else {
      next = [{ ...form, id: Date.now().toString(36), loggedAt: new Date().toISOString() }, ...bags];
    }
    persist(next);
    closeModal();
  };

  const openEdit = (bag) => {
    const { id, loggedAt, ...fields } = bag;
    setForm({ ...EMPTY_FORM, ...fields });
    setEditingId(id);
    setCalOpen(false);
    setShowModal(true);
  };

  const closeModal = () => {
    setShowModal(false);
    setCalOpen(false);
    setEditingId(null);
    setForm(EMPTY_FORM);
  };

  const persistGear = (next) => {
    setGear(next);                       // render at once
    setSaveError(null);
    // the write happens in the background; the UI doesn't wait on it
    Promise.resolve(storage.set("coffee-cabinet", JSON.stringify(next))).catch(() => {
      setSaveError("Couldn't save to storage — changes may not persist.");
    });
  };

  const saveGear = () => {
    if (!gearForm.name.trim()) return;
    if (gearEditId) {
      persistGear(gear.map((g) => (g.id === gearEditId ? { ...g, ...gearForm } : g)));
    } else {
      persistGear([...gear, { ...gearForm, id: Date.now().toString(36) }]);
    }
    closeGearModal();
  };

  const closeGearModal = () => {
    setShowGearModal(false);
    setGearEditId(null);
    setGearForm({ name: "", detail: "", type: "brewer" });
  };

  const removeGear = (id) => {
    persistGear(gear.filter((g) => g.id !== id));
    closeGearModal();
  };

  const persistBrews = (next) => {
    setBrews(next);                       // render at once
    setSaveError(null);
    // the write happens in the background; the UI doesn't wait on it
    Promise.resolve(storage.set("coffee-brews", JSON.stringify(next))).catch(() => {
      setSaveError("Couldn't save to storage — changes may not persist.");
    });
  };

  const closeBrewModal = () => {
    setShowBrewModal(false);
    setBrewPick(null);
    setBrewMethod(null);
    setBrewStep(1);
    setRecipe(EMPTY_RECIPE);
    setLoggedBrewId(null);
    setTasting(EMPTY_TASTING);
    setNotes("");
    setReviewReturning(false);
  };

  const addBrew = () => {
    if (!brewPick || !brewMethod) return;
    const bag = bags.find((b) => b.id === brewPick);
    if (!bag) return;
    // Snapshot the chosen cabinet gear by name, so the brew record survives
    // renaming or removing that gear later — same reasoning as the bag fields below.
    const grinderGear = gear.find((g) => g.id === recipe.grinderId);
    const brewerGear = gear.find((g) => g.id === recipe.brewerId);
    const { grinderId, brewerId, ...recipeRest } = recipe;
    const recipeSnapshot = {
      ...recipeRest,
      grinder: grinderGear ? grinderGear.name : "",
      brewer: brewerGear ? brewerGear.name : "",
    };
    const brew = {
      id: Date.now().toString(36),
      bagId: bag.id,
      brewedAt: new Date().toISOString(),
      // snapshot, so the brew record survives editing or removing the bag
      roaster: bag.roaster,
      roasterCountry: bag.roasterCountry,
      origin: bag.origin,
      variety: bag.variety,
      processing: bag.processing,
      roastDate: bag.roastDate,
      method: brewMethod,
      recipe: recipeSnapshot,
    };
    persistBrews([brew, ...brews]);
    setLoggedBrewId(brew.id);
    setReviewReturning(false);
    setBrewStep(4); // the Notes / Sensory Web / Later picker
  };

  const openReview = (brew) => {
    setLoggedBrewId(brew.id);
    setTasting({ ...EMPTY_TASTING, ...(brew.tasting || {}) });
    setNotes(brew.notes || "");
    setBrewMethod(brew.method);
    setReviewReturning(true);
    setBrewStep(4);   // the picker, so an existing brew can gain either half
    setShowBrewModal(true);
  };

  const saveTasting = () => {
    persistBrews(brews.map((x) => (x.id === loggedBrewId ? { ...x, tasting } : x)));
    closeBrewModal();
  };

  // Notes live beside `tasting`, not inside it: a brew may have either, both or neither.
  const saveNotes = () => {
    const text = notes.trim();
    persistBrews(brews.map((x) => (x.id === loggedBrewId ? { ...x, notes: text } : x)));
    closeBrewModal();
  };

  const removeBrew = (id) => {
    persistBrews(brews.filter((x) => x.id !== id));
  };

  const toggleArchive = (id) => {
    persist(bags.map((b) => (b.id === id ? { ...b, archived: !b.archived } : b)));
  };

  const toggleFavorite = (id) => {
    persist(bags.map((b) => (b.id === id ? { ...b, favorite: !b.favorite } : b)));
  };

  const removeBag = (id) => {
    persist(bags.filter((b) => b.id !== id));
  };

  const set = (key) => (e) => setForm({ ...form, [key]: e.target.value });

  const setFilter = (key) => (e) => {
    const value = e.target.value;
    setFilters((prev) => {
      const next = { ...prev, [key]: value };
      if (key === "month") next.day = ""; // day depends on month
      return next;
    });
  };

  // Distinct values for each filterable field, from bags currently logged
  const optionsFor = (key) =>
    [...new Set(bags.map((b) => (b[key] || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));

  // Roast date subcategories: months (YYYY-MM), then days within the chosen month
  const months = [...new Set(bags.map((b) => (b.roastDate || "").slice(0, 7)).filter((m) => m.length === 7))].sort().reverse();
  const daysInMonth = filters.month
    ? [...new Set(bags.filter((b) => (b.roastDate || "").startsWith(filters.month)).map((b) => b.roastDate.slice(8, 10)))].sort()
    : [];

  const filtered = bags.filter((b) => {
    if (filters.roaster && (b.roaster || "").trim() !== filters.roaster) return false;
    if (filters.machine && (b.machine || "").trim() !== filters.machine) return false;
    if (filters.origin && (b.origin || "").trim() !== filters.origin) return false;
    if (filters.variety && (b.variety || "").trim() !== filters.variety) return false;
    if (filters.processing && (b.processing || "").trim() !== filters.processing) return false;
    if (filters.month && !(b.roastDate || "").startsWith(filters.month)) return false;
    if (filters.day && (b.roastDate || "").slice(8, 10) !== filters.day) return false;
    return true;
  });

  // A bag with no weight logged still counts as in stock — we just can't track it.
  const inStockCount = bags.filter((b) => {
    if (b.archived) return false;
    const left = remainingGrams(b, brews);
    return left === null || left > 0;
  }).length;

  // The brew picker only offers bags still on the shelf — an archived bag is a finished bag.
  const brewableBags = bags.filter((b) => !b.archived);

  const activeFilterCount = Object.values(filters).filter(Boolean).length;
  const sorted = [...filtered]
    .filter((b) => !b.archived)
    .sort((a, b) => (b.roastDate || "").localeCompare(a.roastDate || ""));
  // Archived bags: favourites float to the top, then newest roast date first.
  const archived = [...filtered]
    .filter((b) => b.archived)
    .sort(
      (a, b) =>
        (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0) ||
        (b.roastDate || "").localeCompare(a.roastDate || "")
    );

  const setRecipeField = (key) => (e) => setRecipe((r) => recalcRecipe(r, key, e.target.value));

  const setPour = (i, key) => (e) =>
    setRecipe((r) => ({ ...r, pours: r.pours.map((p, idx) => (idx === i ? { ...p, [key]: e.target.value } : p)) }));

  // Cabinet gear offered in the Recipe step: grinders of either kind, and any brewer/machine.
  const grinderOptions = gear.filter((g) => g.type === "handgrinder" || g.type === "grinder");
  const brewerOptions = gear.filter((g) => g.type === "brewer" || g.type === "espresso");

  const waterTarget = num(recipe.water) || 0;
  const poured = recipe.pours.reduce((sum, p) => sum + (num(p.to) || 0), 0);
  const remaining = Math.max(0, Math.round(waterTarget - poured));

  const addPour = () => setRecipe((r) => ({ ...r, pours: [...r.pours, { to: "", sec: "" }] }));
  const removePour = (i) => setRecipe((r) => ({ ...r, pours: r.pours.filter((_, idx) => idx !== i) }));

  const recipeReady = Boolean(num(recipe.dose) && num(recipe.water));
  const stepReady = brewStep === 1 ? Boolean(brewPick) : brewStep === 2 ? Boolean(brewMethod) : brewStep === 3 ? recipeReady : true;

  const recipeLabel = {
    fontFamily: "'VT323', monospace",
    fontSize: 14,
    letterSpacing: "0.08em",
    textTransform: "uppercase",
    color: T.inkSoft,
  };

  const recipeInput = {
    width: 62,
    padding: "6px 8px",
    border: `1px solid ${T.line}`,
    borderRadius: 0,
    background: "#FFFFFF",
    fontFamily: "'VT323', monospace",
    fontSize: 17,
    color: T.ink,
    textAlign: "center",
  };

  const filterSelectStyle = {
    padding: "6px 8px",
    border: `1px solid ${T.line}`,
    borderRadius: 0,
    background: "#FFFFFF",
    fontFamily: "'VT323', monospace",
    fontSize: 14,
    color: T.ink,
    minWidth: 0,
  };
  const filterLabelStyle = {
    fontFamily: "'VT323', monospace",
    fontSize: 12,
    letterSpacing: "0.08em",
    textTransform: "uppercase",
    color: T.inkSoft,
  };

  const renderBagCard = (b) => {
              return (
                <article
                  key={b.id}
                  className="ci-card"
                  onClick={() => { setBagDetail(b.id); setConfirmDelete(null); }}
                  role="button"
                  tabIndex={0}
                  onKeyDown={(e) => {
                    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setBagDetail(b.id); setConfirmDelete(null); }
                  }}
                  style={{
                    background: b.archived ? T.brownBg : T.card,
                    border: `1px solid ${b.archived ? "#C6B49A" : T.line}`,
                    borderLeft: `4px solid ${b.archived ? T.brown : T.beanSoft}`,
                    padding: D.card.padding,
                    cursor: "pointer",
                    width: "100%",   // the grid track sets the real width now
                    height: b.archived ? D.card.archivedHeight : D.card.height,
                    boxSizing: "border-box",
                    overflow: "hidden",
                    display: "flex",
                    flexDirection: "column",
                  }}
                >
                  {/* Card face — fixed height so the divider never shifts */}
                  <div style={{ minWidth: 0, height: b.archived ? D.card.archivedFaceHeight : D.card.faceHeight, flexShrink: 0, overflow: "hidden" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, margin: "0 0 10px" }}>
                      <h3 style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 11, lineHeight: 1.2, margin: 0, color: T.ink, transform: `scaleY(${D.stretch.cardTitle})`, transformOrigin: "left top", display: "block", minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                        {b.roaster}
                      </h3>
                      <Flag country={b.roasterCountry} size={FLAG_SIZE * D.flag.roasterScale} nudge={D.flag.roasterNudge} />
                      <button
                        type="button"
                        onClick={(e) => { e.stopPropagation(); toggleFavorite(b.id); }}
                        aria-label={b.favorite ? "Unfavourite this bag" : "Favourite this bag"}
                        aria-pressed={b.favorite ? "true" : "false"}
                        title={b.favorite ? "Favourited" : "Favourite this bag"}
                        style={{ marginLeft: "auto", flexShrink: 0, background: "none", border: "none", padding: 2, cursor: "pointer", lineHeight: 0 }}
                      >
                        <BeanMark filled={Boolean(b.favorite)} />
                      </button>
                    </div>
                    <div
                      title={[b.variety, b.processing].filter(Boolean).join(" · ")}
                      style={{ fontFamily: "'VT323', monospace", fontSize: 16, lineHeight: 1.15, color: T.inkSoft, letterSpacing: "0.04em", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}
                    >
                      {[b.variety, shortProcess(b.processing)].filter(Boolean).join(" · ") || "variety & process unlogged"}
                    </div>
                    <div style={{ fontFamily: "'VT323', monospace", fontSize: 16, lineHeight: 1.15, color: T.bean, textTransform: "uppercase", letterSpacing: "0.1em", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                      {b.origin ? <>{b.origin} <Flag country={b.origin} /></> : "origin unlogged"}
                    </div>
                    {/* Archived bags are off the shelf — weight and resting are dropped to collapse the card. */}
                    {!b.archived && (
                    <div style={{ fontFamily: "'VT323', monospace", fontSize: 16, lineHeight: 1.15, color: T.inkSoft, letterSpacing: "0.04em", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                      {(() => {
                        if (!b.weight) return "weight unlogged";
                        const left = remainingGrams(b, brews);
                        const start = toGrams(b.weight);
                        if (left === null || start === null) return formatWeight(b.weight);
                        if (left <= 0) return <span style={{ color: T.rust }}>EMPTY · {Math.round(start)} g used</span>;
                        return <>{Math.round(left)} g <span style={{ color: T.muted }}>of {Math.round(start)} g left</span></>;
                      })()}
                    </div>
                    )}
                  </div>

                  {/* Roast date + resting, pinned to card bottom; expand arrow bottom-right */}
                  <div style={{ marginTop: D.micro.dividerGapTop, paddingTop: 7, borderTop: `1px dashed ${T.line}`, fontFamily: "'VT323', monospace", fontSize: 15, display: "flex", justifyContent: "space-between", alignItems: "flex-end", gap: 8 }}>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ color: T.inkSoft, letterSpacing: "0.06em", lineHeight: 1.15 }}>
                        ROASTED <span style={{ color: T.ink }}>{b.roastDate || "—"}</span>
                      </div>
                      {!b.archived && (
                      <div style={{ display: "flex", alignItems: "center", gap: 6, color: T.inkSoft, letterSpacing: "0.06em", lineHeight: 1.15, marginTop: 1 }}>
                        <span>RESTED</span>
                        <Freshness dateStr={b.roastDate} />
                      </div>
                      )}
                    </div>
                    <span style={{ fontFamily: "'VT323', monospace", fontSize: 18, lineHeight: 1, color: T.inkSoft, flexShrink: 0 }}>
                      ⋯
                    </span>
                  </div>

                </article>
              );
  };


  // Lifted out of the tab strip so the SAME buttons can sit inside it on desktop and on
  // their own row above it on a phone. They cannot simply wrap: a wrapped line lands
  // BELOW the tabs, between them and the folder, which breaks the tab-to-folder junction
  // the whole folder metaphor rests on.
  const dataButton = (
    <button
      key="data"
      onClick={() => { setShowData(true); setImportMsg(null); }}
      title="Export or import your data"
      style={{
        marginLeft: narrow ? 0 : "auto",
        marginBottom: narrow ? 0 : 5,
        marginRight: narrow ? 0 : 8,
        background: "none",
        color: T.inkSoft,
        border: `${D.folder.border}px solid ${T.line}`,
        borderRadius: D.folder.tabRadius,
        padding: "10px 14px",
        fontFamily: "'Press Start 2P', monospace",
        fontSize: 10,
        lineHeight: 1,
        cursor: "pointer",
      }}
    >
      <span style={{ display: "inline-block", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}>
        Data
      </span>
    </button>
  );

  const newButton = (
    <button
      key="new"
      className="ci-btn"
      onClick={() => {
        if (tab === "backlog") setShowModal(true);
        else if (tab === "brew") { setBrewStep(1); setShowBrewModal(true); }
        else setShowGearModal(true);
      }}
      style={{
        marginBottom: narrow ? 0 : 5,
        marginRight: narrow ? 0 : D.folder.btnShadow,
        background: T.bean,
        color: T.card,
        border: "none",
        borderRadius: D.folder.tabRadius,
        padding: "10px 22px",
        fontFamily: "'Press Start 2P', monospace",
        fontSize: 10,
        lineHeight: 1,
        cursor: "pointer",
        boxShadow: `${D.folder.btnShadow}px ${D.folder.btnShadow}px 0 ${T.ink}`,
      }}
    >
      <span style={{ display: "inline-block", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}>
        {tab === "backlog" ? "+ New Bag" : tab === "brew" ? "+ New Brew" : "+ New Item"}
      </span>
    </button>
  );

  return (
    <div style={{ minHeight: "100vh", background: T.paper, color: T.ink, fontFamily: "'VT323', monospace", padding: "0 0 64px" }}>
      <style>{FONTS}</style>

      {/* Header */}
      <header style={{ maxWidth: D.page.maxWidth, margin: "0 auto", padding: narrow ? "24px 16px 8px" : "40px 24px 8px" }}>
        <div>
          <h1 style={{ fontFamily: "'Press Start 2P', monospace", fontWeight: 650, fontSize: "clamp(16px, 3.2vw, 26px)", margin: "0 0 14px", lineHeight: 1.05, transform: `scaleY(${D.stretch.pageTitle})`, transformOrigin: "left top", display: "inline-block" }}>
            {tab === "backlog" ? "THE BACKLOG" : tab === "brew" ? "THE BREW LOG" : "THE CABINET"}
          </h1>
          <div style={{ fontFamily: "'VT323', monospace", fontSize: 18, letterSpacing: "0.12em", textTransform: "lowercase", color: T.bean, marginLeft: D.micro.countLineIndent }}>
            {tab === "backlog" ? (
              <><strong style={{ fontWeight: 700, color: T.ink }}>{inStockCount}</strong> bag{inStockCount === 1 ? "" : "s"} in stock</>
            ) : tab === "brew" ? (
              <><strong style={{ fontWeight: 700, color: T.ink }}>{brews.length}</strong> brew{brews.length === 1 ? "" : "s"} logged</>
            ) : (
              <><strong style={{ fontWeight: 700, color: T.ink }}>{gear.length}</strong> item{gear.length === 1 ? "" : "s"} on the shelf</>
            )}
          </div>
        </div>
      </header>

      {/* On a phone the Data / New buttons get their own row ABOVE the strip, so the tabs
          stay the last thing before the folder and the junction between them survives. */}
      {narrow && (
        <div style={{ maxWidth: D.page.maxWidth, boxSizing: "border-box", margin: "14px auto 0", padding: "0 10px", display: "flex", gap: 8, justifyContent: "flex-end", alignItems: "center" }}>
          {dataButton}
          {newButton}
        </div>
      )}

      {/* Tabs — manila folders sitting in a drawer */}
      <nav
        style={{
          maxWidth: D.page.maxWidth,
          // border-box, or the 20px left padding is added OUTSIDE the 1080 and the
          // strip ends up 1100 wide — 10px proud of the folder on each side, which
          // is what pushed the New button past the folder's right edge.
          boxSizing: "border-box",
          margin: narrow ? "10px auto 0" : "18px auto 0",
          // 10, not 20: under border-box the padding now sits inside the 1080, so 20
          // would push the tab strip 10px right of where it has always sat. 10 keeps
          // the tabs exactly where they were and only the right edge moves.
          padding: "0 0 0 10px",
          display: "flex",
          alignItems: "flex-end",
          gap: 0,
        }}
      >
        {[["backlog", "Backlog"], ["brew", "Brew"], ["cabinet", "Cabinet"]].map(([key, label]) => {
          const active = tab === key;
          return (
            <button
              key={key}
              onClick={() => setTab(key)}
              aria-current={active ? "page" : undefined}
              style={{
                position: "relative",
                zIndex: active ? 2 : 1,
                // EVERY tab overlaps the folder's top border by exactly its thickness, so the
                // tab's bottom edge and the folder's top edge land in the SAME 2px band rather
                // than stacking into a 4px rule. Only the active tab used to do this, which is
                // why the inactive tabs sat on a visibly doubled line.
                marginBottom: -D.folder.border,
                marginLeft: D.folder.overlap,
                background: active ? T.paper : "#E0DCCE",
                border: `2px solid ${active ? T.ink : "#BEB6A2"}`,
                // the active tab's lip overlaps the folder's top border and hides it
                borderBottom: active ? `2px solid ${T.paper}` : `2px solid ${T.ink}`,
                marginRight: 0,
                borderRadius: `${D.folder.tabRadius}px ${D.folder.tabRadius}px 0 0`,
                // Inactive top padding is 9 rather than 7 because the overlap above drops those
                // tabs 2px; this holds their top edges exactly where they were.
                // Narrow trims the HORIZONTAL padding only — at full labels the three tabs then
                // need ~260px, which clears a 390px phone. The vertical values are untouched so
                // the 2px overlap onto the folder still lands exactly where it should.
                padding: active
                  ? (narrow ? "8px 14px 9px" : "8px 28px 9px")
                  : (narrow ? "9px 12px 8px" : "9px 25px 8px"),
                cursor: "pointer",
                fontFamily: "'Press Start 2P', monospace",
                fontSize: 10,
                lineHeight: 1,
                color: active ? T.ink : T.muted,
              }}
            >
              <span style={{ display: "inline-block", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}>
                {label}
              </span>
            </button>
          );
        })}

        {!narrow && dataButton}
        {!narrow && newButton}
      </nav>

      {/* Folder body — the tab strip's baseline is its top edge */}
      <div
        style={{
          maxWidth: D.page.maxWidth,
          margin: "0 auto",
          background: T.paper,
          border: `${D.folder.border}px solid ${T.ink}`,
          borderRadius: D.folder.radius,
          padding: narrow ? "16px 12px 24px" : `18px ${D.page.padding}px 30px`,
          boxSizing: "border-box",
          minHeight: 260,
        }}
      >

      {/* Filters */}
      {tab === "backlog" && bags.length > 0 && (
        <section style={{ margin: "0 0 4px" }}>
          <div style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 0, padding: "11px 13px" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
              <button
                onClick={() => setFiltersOpen((v) => !v)}
                aria-expanded={filtersOpen}
                style={{ background: "none", border: "none", padding: 0, cursor: "pointer", display: "flex", alignItems: "center", gap: 7, fontFamily: "'VT323', monospace", fontSize: 12, letterSpacing: "0.12em", textTransform: "uppercase", color: T.bean }}
              >
                <span style={{ fontSize: 11 }}>{filtersOpen ? "▲" : "▼"}</span>
                Filter
                {activeFilterCount > 0 && <span style={{ color: T.ink }}>· {activeFilterCount} active</span>}
              </button>
              {activeFilterCount > 0 && (
                <button
                  onClick={() => setFilters(EMPTY_FILTERS)}
                  style={{ background: "none", border: "none", color: T.rust, cursor: "pointer", fontSize: 13, fontFamily: "'VT323', monospace" }}
                >
                  Clear all ({activeFilterCount})
                </button>
              )}
            </div>
            {filtersOpen && (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(120px, 1fr))", gap: "8px 10px", marginTop: 10 }}>
              <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                <span style={filterLabelStyle}>Roaster</span>
                <select value={filters.roaster} onChange={setFilter("roaster")} style={filterSelectStyle}>
                  <option value="">All</option>
                  {optionsFor("roaster").map((v) => <option key={v} value={v}>{v}</option>)}
                </select>
              </label>
              <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                <span style={filterLabelStyle}>Roasting machine</span>
                <select value={filters.machine} onChange={setFilter("machine")} style={filterSelectStyle}>
                  <option value="">All</option>
                  {optionsFor("machine").map((v) => <option key={v} value={v}>{v}</option>)}
                </select>
              </label>
              <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                <span style={filterLabelStyle}>Origin</span>
                <select value={filters.origin} onChange={setFilter("origin")} style={filterSelectStyle}>
                  <option value="">All</option>
                  {optionsFor("origin").map((v) => <option key={v} value={v}>{v}</option>)}
                </select>
              </label>
              <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                <span style={filterLabelStyle}>Bean variety</span>
                <select value={filters.variety} onChange={setFilter("variety")} style={filterSelectStyle}>
                  <option value="">All</option>
                  {optionsFor("variety").map((v) => <option key={v} value={v}>{v}</option>)}
                </select>
              </label>
              <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                <span style={filterLabelStyle}>Processing</span>
                <select value={filters.processing} onChange={setFilter("processing")} style={filterSelectStyle}>
                  <option value="">All</option>
                  {optionsFor("processing").map((v) => <option key={v} value={v}>{v}</option>)}
                </select>
              </label>
              <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                <span style={filterLabelStyle}>Roast month</span>
                <select value={filters.month} onChange={setFilter("month")} style={filterSelectStyle}>
                  <option value="">All</option>
                  {months.map((m) => <option key={m} value={m}>{monthLabel(m)}</option>)}
                </select>
              </label>
              <label style={{ display: "flex", flexDirection: "column", gap: 4, opacity: filters.month ? 1 : 0.45 }}>
                <span style={filterLabelStyle}>Roast day</span>
                <select value={filters.day} onChange={setFilter("day")} disabled={!filters.month} style={{ ...filterSelectStyle, cursor: filters.month ? "pointer" : "not-allowed" }}>
                  <option value="">{filters.month ? "All days" : "Pick a month"}</option>
                  {daysInMonth.map((d) => <option key={d} value={d}>{parseInt(d, 10)}</option>)}
                </select>
              </label>
            </div>
            )}
            {filtersOpen && activeFilterCount > 0 && (
              <div style={{ marginTop: 10, fontFamily: "'VT323', monospace", fontSize: 16, color: T.inkSoft }}>
                Showing {sorted.length} of {bags.length} bags
              </div>
            )}
          </div>
        </section>
      )}

      {/* Backlog */}
      {tab === "backlog" && (
      <main>
        {loading ? (
          <p style={{ color: T.inkSoft, fontFamily: "'VT323', monospace", fontSize: 18, padding: "32px 0" }}>Loading inventory…</p>
        ) : sorted.length === 0 && archived.length === 0 ? (
          <div style={{ textAlign: "center", padding: "72px 16px", border: `1px dashed ${T.line}`, borderRadius: 0, marginTop: 24, background: T.card }}>
            {bags.length === 0 ? (
              <>
                <p style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 14, lineHeight: 1.6, margin: "0 0 8px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "left top", display: "inline-block" }}>The shelf is empty.</p>
                <p style={{ color: T.inkSoft, fontSize: 18, margin: 0 }}>Log your first bag to start the record.</p>
              </>
            ) : (
              <>
                <p style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 13, lineHeight: 1.6, margin: "0 0 8px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "left top", display: "inline-block" }}>No bags match these filters.</p>
                <button
                  onClick={() => setFilters(EMPTY_FILTERS)}
                  style={{ background: "none", border: `1px solid ${T.line}`, borderRadius: 0, padding: "8px 16px", color: T.bean, cursor: "pointer", fontSize: 17, fontFamily: "'VT323', monospace", fontWeight: 600 }}
                >
                  Clear filters
                </button>
              </>
            )}
          </div>
        ) : (
          <>
          {sorted.length > 0 && (
            <div style={{ display: "grid", gridTemplateColumns: `repeat(auto-fill, minmax(min(100%, ${D.card.width}px), 1fr))`, gap: D.card.gap, marginTop: 14, justifyContent: "start", alignItems: "start" }}>
              {sorted.map((b) => renderBagCard(b))}
            </div>
          )}

          {archived.length > 0 && (
            <section style={{ marginTop: 34 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, borderTop: `2px solid ${T.brown}`, paddingTop: 10, marginBottom: 12 }}>
                <h2 style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 12, margin: 0, color: T.brown, transform: `scaleY(${D.stretch.button})`, transformOrigin: "left center", display: "inline-block" }}>
                  Archive
                </h2>
                <span style={{ fontSize: 17, color: T.muted, letterSpacing: "0.06em" }}>
                  {archived.length} bag{archived.length === 1 ? "" : "s"}
                </span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: `repeat(auto-fill, minmax(min(100%, ${D.card.width}px), 1fr))`, gap: D.card.gap, justifyContent: "start", alignItems: "start" }}>
                {archived.map((b) => renderBagCard(b))}
              </div>
            </section>
          )}
          </>
        )}
      </main>
      )}

      {/* Brew log */}
      {tab === "brew" && (
        <main>
          {brews.length === 0 ? (
            <div style={{ textAlign: "center", padding: "72px 16px", border: `1px dashed ${T.line}`, background: T.card }}>
              <p style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 13, lineHeight: 1.6, margin: "0 0 8px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "left top", display: "inline-block" }}>No brews yet.</p>
              <p style={{ color: T.inkSoft, fontSize: 18, margin: 0 }}>
                {bags.length === 0 ? "Log a bag in the Backlog first." : "Hit + New Brew to pick a bag."}
              </p>
            </div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: `repeat(auto-fill, minmax(min(100%, ${D.card.width}px), 1fr))`, gap: 12, justifyContent: "start", alignItems: "start" }}>
              {brews.map((x) => {
                const method = METHODS.find((m) => m.key === x.method);
                return (
                <article
                  key={x.id}
                  className="ci-card"
                  onClick={() => setBrewDetail(x.id)}
                  role="button"
                  tabIndex={0}
                  onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setBrewDetail(x.id); } }}
                  style={{
                    background: T.card,
                    border: `1px solid ${T.line}`,
                    borderLeft: `4px solid ${T.beanSoft}`,
                    padding: "9px 12px",
                    width: "100%",   // the grid track sets the real width now
                    boxSizing: "border-box",
                    cursor: "pointer",
                  }}
                >
                  {/* Header: method icon + name, date top-right */}
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                    <span style={{ display: "flex", alignItems: "center", gap: 7, minWidth: 0 }}>
                      {/* the cone+carafe sit low in the 12x12 grid, so lift the icon
                          to put their midline on the label's midline */}
                      <span style={{ position: "relative", top: D.micro.methodIconLift, display: "flex", flexShrink: 0 }}>
                        <PixelIcon name={x.method} cell={1.7} />
                      </span>
                      <span style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 10, lineHeight: 1.2, color: T.ink, transform: `scaleY(${D.stretch.cardTitle})`, transformOrigin: "left center", display: "block", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                        {x.method === "orb" ? "ORB" : (method || {}).label || "Brew"}
                      </span>
                    </span>
                    <span style={{ fontSize: 15, color: T.muted, letterSpacing: "0.04em", flexShrink: 0 }}>
                      {new Date(x.brewedAt).toLocaleDateString(undefined, { month: "short", day: "numeric" })}
                    </span>
                  </div>

                  {/* Bean lines: roaster, then variety + processing on its own row */}
                  <div style={{ marginTop: 7, fontSize: 15, lineHeight: 1.25, color: T.ink, letterSpacing: "0.03em", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    {x.roaster}
                  </div>
                  {[x.variety, x.processing].filter(Boolean).length > 0 && (
                    <div
                      title={[x.variety, x.processing].filter(Boolean).join(" · ")}
                      style={{ fontSize: 15, lineHeight: 1.25, color: T.inkSoft, letterSpacing: "0.03em", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}
                    >
                      {[x.variety, shortProcess(x.processing)].filter(Boolean).join(" · ")}
                    </div>
                  )}
                  <div style={{ fontSize: 15, lineHeight: 1.25, color: T.bean, textTransform: "uppercase", letterSpacing: "0.08em", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    {x.origin ? <>{x.origin} <Flag country={x.origin} /></> : "origin unlogged"}
                  </div>

                </article>
                );
              })}
            </div>
          )}
        </main>
      )}


      {/* Cabinet */}
      {tab === "cabinet" && (
        <main>
          {gear.length === 0 ? (
            <div style={{ textAlign: "center", padding: "72px 16px", border: `1px dashed ${T.line}`, background: T.card }}>
              <p style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 13, lineHeight: 1.6, margin: "0 0 8px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "left top", display: "inline-block" }}>The cabinet is bare.</p>
              <p style={{ color: T.inkSoft, fontSize: 18, margin: 0 }}>Add your first piece of kit.</p>
            </div>
          ) : (
            GEAR_TYPES.filter((t) => gear.some((g) => g.type === t.key)).map((type) => (
              <section key={type.key} style={{ marginBottom: 26 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, borderBottom: `1px solid ${T.line}`, paddingBottom: 6, marginBottom: 12 }}>
                  <h2 style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 10, margin: 0, color: T.bean, transform: `scaleY(${D.stretch.button})`, transformOrigin: "left center", display: "inline-block" }}>
                    {type.label}
                  </h2>
                  <span style={{ fontSize: 16, color: T.muted }}>
                    {gear.filter((g) => g.type === type.key).length}
                  </span>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: `repeat(auto-fill, minmax(min(100%, ${D.card.width}px), 1fr))`, gap: D.card.gap, justifyContent: "start", alignItems: "start" }}>
                  {gear.filter((g) => g.type === type.key).map((g) => (
                    <article
                      key={g.id}
                      className="ci-card"
                      onClick={() => { setGearEditId(g.id); setGearForm({ name: g.name, detail: g.detail || "", type: g.type }); setShowGearModal(true); }}
                      role="button"
                      tabIndex={0}
                      onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setGearEditId(g.id); setGearForm({ name: g.name, detail: g.detail || "", type: g.type }); setShowGearModal(true); } }}
                      style={{
                        background: T.card,
                        border: `1px solid ${T.line}`,
                        borderLeft: `4px solid ${T.beanSoft}`,
                        padding: "12px 14px",
                        width: "100%",   // the grid track sets the real width now
                        boxSizing: "border-box",
                        cursor: "pointer",
                        display: "flex",
                        alignItems: "center",
                        gap: 14,
                        minHeight: D.cabinetCardMinHeight,
                      }}
                    >
                      <span style={{ minWidth: 0 }}>
                        <span style={{ display: "block", fontFamily: "'Press Start 2P', monospace", fontSize: 10, lineHeight: 1.3, color: T.ink, transform: `scaleY(${D.stretch.cardTitle})`, transformOrigin: "left top", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                          {g.name}
                        </span>
                      </span>
                      {/* notes stay tucked away — a small marker hints they exist */}
                      {g.detail && (
                        <span
                          title="Has notes"
                          style={{ marginLeft: "auto", fontFamily: "'VT323', monospace", fontSize: 16, color: T.muted, flexShrink: 0, alignSelf: "center" }}
                        >
                          ✎
                        </span>
                      )}
                    </article>
                  ))}
                </div>
              </section>
            ))
          )}
        </main>
      )}

      </div>

      {/* Export / import */}
      {showData && (
        <div
          onClick={(e) => { if (e.target === e.currentTarget) setShowData(false); }}
          style={{ position: "fixed", inset: 0, background: "rgba(43,33,24,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 60 }}
        >
          <div style={{ background: T.card, width: "100%", maxWidth: 560, maxHeight: "90vh", display: "flex", flexDirection: "column", border: `1px solid ${T.line}`, borderRadius: D.folder.radius, overflow: "hidden", boxShadow: "6px 6px 0 rgba(43,33,24,0.55)" }}>
            <div style={{ padding: "18px 24px 14px" }}>
              <h2 style={{ fontFamily: "'Press Start 2P', monospace", fontWeight: 650, fontSize: 14, margin: 0, transform: `translateY(2px) scaleY(${D.stretch.button})`, transformOrigin: "left center", display: "inline-block" }}>
                Move Your Data
              </h2>
            </div>
            {/* Inset to the card gutter, so it reads as a rule under the title rather
                than a seam cutting the card edge to edge. */}
            <div style={{ height: 2, background: T.ink, margin: "0 24px", flexShrink: 0 }} />

            <div style={{ padding: "16px 24px", overflowY: "auto", flex: 1 }}>
              <div style={{ fontSize: 17, color: T.inkSoft, marginBottom: 12, lineHeight: 1.4 }}>
                {bags.length} bags · {brews.length} brews · {gear.length} cabinet items
              </div>

              {/* Export */}
              <div style={{ fontFamily: "'VT323', monospace", fontSize: 14, letterSpacing: "0.08em", textTransform: "uppercase", color: T.bean, marginBottom: 6 }}>
                1 · Export from here
              </div>
              <textarea
                readOnly
                value={buildExport()}
                onFocus={(e) => e.target.select()}
                style={{ width: "100%", height: 110, boxSizing: "border-box", padding: "8px 10px", border: `1px solid ${T.line}`, borderRadius: 0, background: "#FFFFFF", fontFamily: "'VT323', monospace", fontSize: 14, color: T.ink, resize: "vertical" }}
              />
              <div style={{ display: "flex", gap: 8, margin: "8px 0 20px" }}>
                <button
                  onClick={downloadExport}
                  style={{ background: T.bean, border: "none", borderRadius: D.folder.tabRadius, color: T.card, cursor: "pointer", fontSize: 10, fontFamily: "'Press Start 2P', monospace", padding: "9px 12px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                >
                  Download .json
                </button>
                <span style={{ fontSize: 16, color: T.muted, alignSelf: "center" }}>
                  or click the box and copy
                </span>
              </div>

              {/* Auto-save */}
              <div style={{ fontFamily: "'VT323', monospace", fontSize: 14, letterSpacing: "0.08em", textTransform: "uppercase", color: T.bean, marginBottom: 6, paddingTop: 12, borderTop: `1px dashed ${T.line}` }}>

                <p style={{ fontSize: 16, color: T.muted, margin: "0 0 20px", lineHeight: 1.4 }}>

                <p style={{ fontSize: 16, color: T.muted, margin: "0 0 20px", lineHeight: 1.4 }}>

                          Stop
                        </button>
                      </>
                    ) : autoState === "needs-permission" ? (
                      <button
                        onClick={resumeAutoSave}
                        style={{ background: T.bean, border: "none", borderRadius: D.folder.tabRadius, color: T.card, cursor: "pointer", fontSize: 10, fontFamily: "'Press Start 2P', monospace", padding: "9px 12px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                      >
                        Resume
                      </button>
                    ) : (
                      <button
                        onClick={chooseBackupFile}
                        style={{ background: T.bean, border: "none", borderRadius: D.folder.tabRadius, color: T.card, cursor: "pointer", fontSize: 10, fontFamily: "'Press Start 2P', monospace", padding: "9px 12px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}

                        Choose file

                  <div style={{ fontSize: 16, margin: "8px 0 20px", lineHeight: 1.4, color: autoState === "error" ? T.rust : autoState === "ready" ? T.bean : T.inkSoft }}>

                  </div>

              {/* Import */}
              <div style={{ fontFamily: "'VT323', monospace", fontSize: 14, letterSpacing: "0.08em", textTransform: "uppercase", color: T.bean, marginBottom: 6, paddingTop: 12, borderTop: `1px dashed ${T.line}` }}>

              </div>
              <textarea

                onChange={(e) => { setImportText(e.target.value); setImportMsg(null); }}

              />
              <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
                <button
                  onClick={() => runImport("merge")}

                  style={{ background: "none", border: `1px solid ${T.bean}`, borderRadius: D.folder.tabRadius, color: importText.trim() ? T.bean : T.muted, cursor: importText.trim() ? "pointer" : "not-allowed", fontSize: 10, fontFamily: "'Press Start 2P', monospace", padding: "9px 12px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                >
                  Merge
                </button>
                <button
                  onClick={() => runImport("replace")}
                  disabled={!importText.trim()}
                  style={{ background: importText.trim() ? T.rust : T.line, border: "none", borderRadius: D.folder.tabRadius, color: T.card, cursor: importText.trim() ? "pointer" : "not-allowed", fontSize: 10, fontFamily: "'Press Start 2P', monospace", padding: "9px 12px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                >
                  Replace all
                </button>
              </div>
              {importMsg && (
                <div style={{ fontSize: 17, color: importMsg.ok ? T.bean : T.rust, marginTop: 10 }}>
                  {importMsg.text}
                </div>

              <p style={{ fontSize: 16, color: T.muted, lineHeight: 1.45, marginTop: 14 }}>
                Merge keeps what's already here and adds anything new. Replace all wipes this
                cabinet first. The app code itself travels separately — download the .jsx file.
              </p>
            </div>

            {/* Same rule as under the title: 2px ink, inset to the card gutter. */}
            <div style={{ height: 2, background: T.ink, margin: "0 24px", flexShrink: 0 }} />
            <div style={{ padding: "12px 24px 18px", display: "flex", justifyContent: "flex-end" }}>
              <button
                onClick={() => setShowData(false)}
                style={{ background: "none", border: `1px solid ${T.line}`, borderRadius: D.folder.tabRadius, padding: "9px 14px", fontSize: 10, cursor: "pointer", color: T.inkSoft, fontFamily: "'Press Start 2P', monospace", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}

            </div>
          </div>
        </div>

          style={{ position: "fixed", inset: 0, background: "rgba(43,33,24,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 50 }}
        >
          <div style={{ background: T.card, width: "100%", maxWidth: 460, border: `1px solid ${T.line}`, borderRadius: D.folder.radius, overflow: "hidden", boxShadow: "6px 6px 0 rgba(43,33,24,0.55)" }}>
            <div style={{ padding: "18px 24px 14px", display: "flex", alignItems: "center", gap: 12 }}>
              <h2 style={{ fontFamily: "'Press Start 2P', monospace", fontWeight: 650, fontSize: 14, margin: 0, transform: `translateY(2px) scaleY(${D.stretch.heading})`, transformOrigin: "left center", display: "inline-block" }}>
                {gearEditId ? "Edit Item" : "New Item"}

            </div>
            {/* Inset to the card gutter, so it reads as a rule under the title rather

                <input

                />

              <label style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                <span style={{ fontFamily: "'VT323', monospace", fontSize: 14, letterSpacing: "0.08em", textTransform: "uppercase", color: T.inkSoft }}>Notes</span>

                </select>

            </div>

            <div style={{ padding: "6px 24px 20px", display: "flex", gap: 8, justifyContent: "space-between" }}>
              {gearEditId ? (
                <button

                  style={{ background: T.rust, border: `1px solid ${T.rust}`, borderRadius: D.folder.tabRadius, color: T.card, cursor: "pointer", fontSize: 10, fontFamily: "'Press Start 2P', monospace", padding: "9px 12px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                >
                  Remove
                </button>
              ) : <span />}
              <span style={{ display: "flex", gap: 8 }}>
                <button
                  onClick={closeGearModal}
                  style={{ background: "none", border: `1px solid ${T.line}`, borderRadius: D.folder.tabRadius, padding: "9px 14px", fontSize: 10, cursor: "pointer", color: T.inkSoft, fontFamily: "'Press Start 2P', monospace", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                >
                  Cancel
                </button>
                <button
                  className="ci-btn"
                  onClick={saveGear}
                  disabled={!gearForm.name.trim()}
                  style={{ background: gearForm.name.trim() ? T.bean : T.beanSoft, color: T.card, border: "none", borderRadius: D.folder.tabRadius, padding: "9px 16px", fontSize: 10, cursor: gearForm.name.trim() ? "pointer" : "not-allowed", fontFamily: "'Press Start 2P', monospace", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                >
                  {gearEditId ? "Save" : "Add item"}
                </button>
              </span>
            </div>
          </div>
        </div>
      )}

      {/* Bag detail popup */}
      {bagDetail && (() => {
        const b = bags.find((x) => x.id === bagDetail);
        if (!b) return null;
        const left = remainingGrams(b, brews);
        const start = toGrams(b.weight);
        const bagBrews = brews.filter((x) => x.bagId === b.id).length;
        return (
          <div
            onClick={(e) => { if (e.target === e.currentTarget) { setBagDetail(null); setConfirmDelete(null); } }}
            style={{ position: "fixed", inset: 0, background: "rgba(43,33,24,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 50 }}
          >
            <div style={{ background: b.archived ? T.brownBg : T.card, width: "100%", maxWidth: 560, maxHeight: "90vh", display: "flex", flexDirection: "column", border: `1px solid ${b.archived ? T.brown : T.line}`, borderRadius: D.folder.radius, overflow: "hidden", boxShadow: "6px 6px 0 rgba(43,33,24,0.55)" }}>
              <div style={{ padding: "18px 24px 14px" }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                  <h2 style={{ fontFamily: "'Press Start 2P', monospace", fontWeight: 650, fontSize: 14, margin: 0, transform: `translateY(2px) scaleY(${D.stretch.cardTitle})`, transformOrigin: "center", display: "inline-block" }}>
                    {b.roaster}
                  </h2>
                  {/* name stretches from `center` here, so the flag needs no drop — see D.flag */}
                  <Flag country={b.roasterCountry} size={FLAG_SIZE * D.flag.roasterScale} />
                </div>
                {b.archived && (
                  <div style={{ fontSize: 15, color: T.brown, letterSpacing: "0.12em", textTransform: "uppercase", textAlign: "center", marginTop: 8 }}>
                    Archived
                  </div>
                )}
              </div>
              {/* Inset to the card gutter, so it reads as a rule under the title rather than
                  a seam cutting the card edge to edge. Follows the archived colour. */}
              <div style={{ height: 2, background: b.archived ? T.brown : T.ink, margin: "0 24px", flexShrink: 0 }} />

              <div style={{ padding: "16px 24px", overflowY: "auto", flex: 1 }}>
                <div style={{ fontSize: 17, color: T.inkSoft, letterSpacing: "0.03em", textAlign: "center" }}>
                  {[b.variety, b.processing].filter(Boolean).join(" · ") || "variety & process unlogged"}
                </div>
                <div style={{ fontSize: 17, color: T.bean, textTransform: "uppercase", letterSpacing: "0.08em", textAlign: "center", marginBottom: 14 }}>
                  {b.origin ? <>{b.origin} <Flag country={b.origin} /></> : "origin unlogged"}
                </div>

                <div style={{ paddingTop: 12, borderTop: `1px dashed ${T.line}` }}>
                  <div style={{ display: "grid", gap: 6, maxWidth: 360, margin: "0 auto" }}>
                    {[
                      ["Roaster country", b.roasterCountry ? <>{b.roasterCountry} <Flag country={b.roasterCountry} /></> : "—"],
                      ["Farmer / Producer", b.producer || "—"],
                      ["Altitude", b.altitude || "—"],
                      ["Roasting machine", b.machine || "—"],
                      ["Roast date", b.roastDate || "—"],
                      ["Rested", daysSince(b.roastDate) === null ? "—" : `${daysSince(b.roastDate)} d`],
                      ["Bag weight", b.weight ? formatWeight(b.weight) : "—"],
                      ["Remaining", left === null ? "—" : left <= 0 ? "empty" : `${Math.round(left)} g`],
                      ["Coffees made", bagBrews === 0 ? "—" : `${bagBrews} brew${bagBrews === 1 ? "" : "s"}`],
                      ["Logged", b.loggedAt ? new Date(b.loggedAt).toLocaleDateString() : "—"],
                    ].map(([label, value]) => (
                      <div key={label} style={{ display: "flex", justifyContent: "space-between", gap: 10, fontSize: 17 }}>
                        <span style={{ color: T.inkSoft, letterSpacing: "0.06em", textTransform: "uppercase" }}>{label}</span>
                        <span style={{ color: value === "—" ? T.muted : T.ink }}>{value}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* how much is left, as a pixel gauge */}
                {left !== null && start !== null && start > 0 && (
                  <div style={{ maxWidth: 360, margin: "16px auto 0" }}>
                    <div style={{ height: 12, border: `2px solid ${T.ink}`, background: "#FFFFFF", display: "flex" }}>
                      <div style={{ width: `${Math.min(100, (left / start) * 100)}%`, background: left <= 0 ? T.rust : T.bean }} />
                    </div>
                    <div style={{ fontSize: 15, color: T.muted, textAlign: "center", marginTop: 4, letterSpacing: "0.04em" }}>
                      {Math.round(left)} g of {Math.round(start)} g left
                    </div>
                  </div>
                )}
              </div>

              {/* Same rule as under the title: 2px ink, inset to the card gutter. */}
              <div style={{ height: 2, background: T.ink, margin: "0 24px", flexShrink: 0 }} />
              <div style={{ padding: "12px 24px 18px", display: "flex", gap: 8, justifyContent: "space-between", flexWrap: "wrap" }}>
                <span style={{ display: "flex", gap: 8 }}>
                  <button
                    onClick={() => toggleArchive(b.id)}
                    style={{ background: b.archived ? T.brown : "none", border: `1px solid ${T.brown}`, borderRadius: D.folder.tabRadius, color: b.archived ? T.card : T.brown, cursor: "pointer", fontSize: 10, fontFamily: "'Press Start 2P', monospace", padding: "9px 12px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                  >
                    {b.archived ? "Unarchive" : "Archive"}
                  </button>
                  <button
                    onClick={() => { setBagDetail(null); openEdit(b); }}
                    style={{ background: "none", border: `1px solid ${T.bean}`, borderRadius: D.folder.tabRadius, color: T.bean, cursor: "pointer", fontSize: 10, fontFamily: "'Press Start 2P', monospace", padding: "9px 12px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                  >
                    Edit
                  </button>
                </span>
                <span style={{ display: "flex", gap: 8 }}>
                  {confirmDelete === b.id && (
                    <button
                      onClick={() => setConfirmDelete(null)}
                      style={{ background: "none", border: `1px solid ${T.line}`, borderRadius: D.folder.tabRadius, color: T.inkSoft, cursor: "pointer", fontSize: 10, fontFamily: "'Press Start 2P', monospace", padding: "9px 12px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                    >
                      No
                    </button>
                  )}
                  <button
                    onClick={() => {
                      if (confirmDelete === b.id) { removeBag(b.id); setConfirmDelete(null); setBagDetail(null); }
                      else setConfirmDelete(b.id);
                    }}
                    style={{ background: confirmDelete === b.id ? T.ink : T.rust, border: `1px solid ${confirmDelete === b.id ? T.ink : T.rust}`, borderRadius: D.folder.tabRadius, color: T.card, cursor: "pointer", fontSize: 10, fontFamily: "'Press Start 2P', monospace", padding: "9px 12px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                  >
                    {confirmDelete === b.id ? "Sure?" : "Remove bag"}
                  </button>
                  <button
                    onClick={() => { setBagDetail(null); setConfirmDelete(null); }}
                    style={{ background: "none", border: `1px solid ${T.line}`, borderRadius: D.folder.tabRadius, padding: "9px 14px", fontSize: 10, cursor: "pointer", color: T.inkSoft, fontFamily: "'Press Start 2P', monospace", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                  >
                    Close
                  </button>
                </span>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Brew detail popup */}
      {brewDetail && (() => {
        const x = brews.find((b) => b.id === brewDetail);
        if (!x) return null;
