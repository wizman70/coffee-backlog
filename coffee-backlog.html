        return (
          <div
            onClick={(e) => { if (e.target === e.currentTarget) setBrewDetail(null); }}
            style={{ position: "fixed", inset: 0, background: "rgba(43,33,24,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 50 }}
          >
            <div style={{ background: T.card, width: "100%", maxWidth: 620, maxHeight: "90vh", display: "flex", flexDirection: "column", border: `1px solid ${T.line}`, borderRadius: D.folder.radius, overflow: "hidden", boxShadow: "6px 6px 0 rgba(43,33,24,0.55)" }}>
              <div style={{ padding: "18px 24px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
                <span style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                  <PixelIcon name={x.method} cell={3} />
                  <h2 style={{ fontFamily: "'Press Start 2P', monospace", fontWeight: 650, fontSize: 14, margin: 0, transform: `translateY(2px) scaleY(${D.stretch.button})`, transformOrigin: "left center", display: "inline-block" }}>
                    {x.method === "orb" ? "ORB" : (method || {}).label || "Brew"}
                  </h2>
                </span>
                <span style={{ fontSize: 17, color: T.muted, letterSpacing: "0.04em", flexShrink: 0 }}>
                  {new Date(x.brewedAt).toLocaleDateString()}
                </span>
              </div>

              {/* Inset to the card gutter, so it reads as a rule under the title rather
                  than a seam cutting the card edge to edge. */}
              <div style={{ height: 2, background: T.ink, margin: "0 24px", flexShrink: 0 }} />

              <div style={{ padding: "16px 24px", overflowY: "auto", flex: 1 }}>
                {/* Bean */}
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 7, marginBottom: 3 }}>
                  <span style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 11, lineHeight: 1.2, color: T.ink, transform: `scaleY(${D.stretch.cardTitle})`, transformOrigin: "center", display: "inline-block" }}>
                    {x.roaster}
                  </span>
                  {/* name stretches from `center` here, so the flag needs no drop — see D.flag */}
                  <Flag country={x.roasterCountry} size={FLAG_SIZE * D.flag.roasterScale} />
                </div>
                <div style={{ fontSize: 17, color: T.inkSoft, letterSpacing: "0.03em", textAlign: "center" }}>
                  {[x.variety, x.processing].filter(Boolean).join(" · ") || "variety & process unlogged"}
                </div>
                <div style={{ fontSize: 17, color: T.bean, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 14, textAlign: "center" }}>
                  {x.origin ? <>{x.origin} <Flag country={x.origin} /></> : "origin unlogged"}
                </div>

                {/* Brew data — metrics on the left, cabinet gear on the right, split by a dashed rule.
                    Label/value pairs sit close together so the two blocks fit side by side without scrolling. */}
                <div style={{ paddingTop: 12, borderTop: `1px dashed ${T.line}` }}>
                {(() => {
                  const grid = { fontSize: 17, display: "grid", gridTemplateColumns: "auto auto", columnGap: 12, rowGap: 6, alignContent: "start" };
                  const row = (label, value) => (
                    <React.Fragment key={label}>
                      <span style={{ color: T.inkSoft, letterSpacing: "0.06em", textTransform: "uppercase" }}>{label}</span>
                      <span style={{ color: value === "—" ? T.muted : T.ink, textAlign: "right" }}>{value}</span>
                    </React.Fragment>
                  );
                  const metricRows = [
                    ["Roast date", x.roastDate || "—"],
                    ["Rested at brew", restedAt(x.roastDate, x.brewedAt)],
                    ["Dose", x.recipe && num(x.recipe.dose) ? `${x.recipe.dose} g` : "—"],
                    ["Ratio", x.recipe && num(x.recipe.ratio) ? `1:${x.recipe.ratio}` : "—"],
                    [x.method === "espresso" ? "Yield" : "Water", x.recipe && num(x.recipe.water) ? `${x.recipe.water} g` : "—"],
                    ...(x.method === "espresso"
                      ? [["Peak pressure", x.recipe && num(x.recipe.pressure) ? `${x.recipe.pressure} bar` : "—"],
                         ["Brew time", x.recipe && num(x.recipe.seconds) ? fmtSeconds(x.recipe.seconds) : "—"]]
                      : []),
                  ];
                  const gs = x.recipe ? x.recipe.grindSize : "";
                  const gearRows = [
                    ["Grinder", x.recipe && x.recipe.grinder ? x.recipe.grinder : "—"],
                    ["Grind size", gs !== undefined && gs !== null && String(gs).trim() !== "" ? String(gs) : "—"],
                    [x.method === "espresso" ? "Machine" : "Dripper", x.recipe && x.recipe.brewer ? x.recipe.brewer : "—"],
                  ];
                  const hasGear = gearRows.some(([, v]) => v !== "—");
                  // alignItems is "stretch", not "flex-start": the gear column is shorter than the
                  // metrics column, and its left border IS the divider — stretching runs that border
                  // the full height so it sits flush top and bottom instead of stopping short.
                  return (
                    <div style={{ display: "flex", justifyContent: "center", alignItems: "stretch", gap: 18, flexWrap: "wrap" }}>
                      <div style={grid}>{metricRows.map(([l, v]) => row(l, v))}</div>
                      {hasGear && (
                        <div style={{ ...grid, borderLeft: `1px dashed ${T.line}`, paddingLeft: 18 }}>
                          {gearRows.map(([l, v]) => row(l, v))}
                        </div>
                      )}
                    </div>
                  );
                })()}
                </div>

                {/* Pour schedule */}
                {x.method !== "espresso" && x.recipe && ((x.recipe.pours && x.recipe.pours.some((pr) => num(pr.to))) || x.recipe.tbt) && (
                  <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px dashed ${T.line}` }}>
                    <div style={{ fontSize: 17, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: T.inkSoft, marginBottom: 4, textAlign: "center" }}>Pour structure</div>
                    {(() => {
                      let cum = 0;
                      return (x.recipe.pours || []).filter((pr) => num(pr.to)).map((pr, pi) => {
                        cum += num(pr.to) || 0;
                        return (
                          <div key={pi} style={{ fontSize: 17, color: T.ink, lineHeight: 1.35, textAlign: "center" }}>
                            {pr.to} g{pi === 0 && num(pr.sec) ? ` · bloom ${pr.sec}s` : ""}
                            <span style={{ color: T.muted }}> · {Math.round(cum)} g total</span>
                          </div>
                        );
                      });
                    })()}
                    <div style={{ fontSize: 17, textAlign: "center", marginTop: 7, letterSpacing: "0.04em" }}>
                      <span style={{ color: T.inkSoft, textTransform: "uppercase" }}>Total brew time </span>
                      <span style={{ color: x.recipe.tbt ? T.ink : T.muted }}>{x.recipe.tbt || "—"}</span>
                    </div>
                  </div>
                )}

                {/* Notes — sits above the sensory web */}
                <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px dashed ${T.line}` }}>
                  <div style={{ fontSize: 17, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: T.inkSoft, marginBottom: 6, textAlign: "center" }}>
                    Notes
                  </div>
                  {x.notes && x.notes.trim() ? (
                    // pre-wrap so the writer's own line breaks survive; break-word so an
                    // unbroken string can't push the popup wider than its max.
                    <div style={{ fontSize: 17, color: T.ink, lineHeight: 1.45, whiteSpace: "pre-wrap", overflowWrap: "break-word" }}>
                      {x.notes}
                    </div>
                  ) : (
                    <div style={{ fontSize: 17, color: T.muted, textAlign: "center", padding: "6px 0" }}>No notes yet</div>
                  )}
                </div>

                {/* Review web */}
                <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px dashed ${T.line}` }}>
                  {x.tasting ? (
                    <>
                      <MiniRadar scores={x.tasting} />
                      <div style={{ fontSize: 17, color: T.rust, textAlign: "center", marginTop: 4 }}>
                        {TASTE_AXES.filter((k) => (x.tasting[k] || 0) > 0).sort((a, b) => x.tasting[b] - x.tasting[a]).slice(0, 3).map((k) => `${k} ${x.tasting[k]}`).join(" · ") || "reviewed"}
                      </div>
                    </>
                  ) : (
                    <div style={{ fontSize: 17, color: T.muted, textAlign: "center", padding: "12px 0" }}>Not reviewed yet</div>
                  )}
                </div>
              </div>

              {/* Same rule as under the title: 2px ink, inset to the card gutter. */}
              <div style={{ height: 2, background: T.ink, margin: "0 24px", flexShrink: 0 }} />
              <div style={{ padding: "12px 24px 18px", display: "flex", gap: 8, justifyContent: "space-between" }}>
                <button
                  onClick={() => { removeBrew(x.id); setBrewDetail(null); }}
                  style={{ background: T.rust, border: `1px solid ${T.rust}`, borderRadius: D.folder.tabRadius, color: T.card, cursor: "pointer", fontSize: 10, fontFamily: "'Press Start 2P', monospace", padding: "9px 12px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                >
                  Delete
                </button>
                <span style={{ display: "flex", gap: 8 }}>
                  <button
                    onClick={() => setBrewDetail(null)}
                    style={{ background: "none", border: `1px solid ${T.line}`, borderRadius: D.folder.tabRadius, padding: "9px 14px", fontSize: 10, cursor: "pointer", color: T.inkSoft, fontFamily: "'Press Start 2P', monospace", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                  >
                    Close
                  </button>
                  <button
                    className="ci-btn"
                    onClick={() => { setBrewDetail(null); openReview(x); }}
                    style={{ background: T.bean, color: T.card, border: "none", borderRadius: D.folder.tabRadius, padding: "9px 14px", fontSize: 10, cursor: "pointer", fontFamily: "'Press Start 2P', monospace", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                  >
                    {x.tasting || (x.notes && x.notes.trim()) ? "Edit review" : "Review"}
                  </button>
                </span>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Bean picker modal */}
      {showBrewModal && (
        <div
          onClick={(e) => { if (e.target === e.currentTarget) closeBrewModal(); }}
          style={{ position: "fixed", inset: 0, background: "rgba(43,33,24,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 50 }}
        >
          {/* Rounded to the folder's radius, and overflow hidden so the header rule and the
              scrolling body are clipped by those corners instead of squaring them off again. */}
          <div style={{ background: T.card, width: "100%", maxWidth: brewStep === 5 ? 682 : 540, maxHeight: "90vh", display: "flex", flexDirection: "column", border: `1px solid ${T.line}`, borderRadius: D.folder.radius, overflow: "hidden", boxShadow: "6px 6px 0 rgba(43,33,24,0.55)" }}>
            <div style={{ padding: "20px 26px 16px" }}>
              <h2 style={{ fontFamily: "'Press Start 2P', monospace", fontWeight: 650, fontSize: 15, margin: 0, transform: `translateY(2px) scaleY(${D.stretch.button})`, transformOrigin: "left center", display: "inline-block" }}>
                {brewStep === 1 ? "Pick Your Beans" : brewStep === 2 ? "Method" : brewStep === 3 ? "Recipe"
                  : brewStep === 4 ? (reviewReturning ? "Review" : "Nice Brew")
                  : brewStep === 5 ? "Sensory Web" : "Notes"}
              </h2>
            </div>
            {/* Inset to the card's own 26px gutter, so it reads as a rule under the title
                rather than a seam cutting the card edge to edge. */}
            <div style={{ height: 2, background: T.ink, margin: "0 26px", flexShrink: 0 }} />

            <div style={{ padding: "14px 26px", overflowY: "auto", flex: 1 }}>
              {brewStep === 4 ? (
                <div style={{ textAlign: "center", padding: "22px 0 14px" }}>
                  <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
                    <PixelIcon name={brewMethod} cell={6} />
                  </div>
                  <p style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 12, lineHeight: 1.6, margin: "0 0 10px", color: T.ink, transform: `scaleY(${D.stretch.button})`, transformOrigin: "center", display: "inline-block" }}>
                    {reviewReturning ? "Review this brew" : "Brew logged!"}
                  </p>
                  <p style={{ fontSize: 19, color: T.inkSoft, margin: "0 0 18px", letterSpacing: "0.04em" }}>
                    How would you like to review it?
                  </p>
                  {/* The scaleY stretch goes on the LABEL, not the button. On the box it
                      inflates the rendered height ~20% past the layout height, and the two
                      buttons swell into the gap until they look like one divided block. */}
                  <div style={{ display: "grid", gap: 10, maxWidth: 300, margin: "0 auto" }}>
                    <button
                      onClick={() => setBrewStep(6)}
                      style={{ background: "none", border: `1px solid ${T.bean}`, borderRadius: D.folder.tabRadius, color: T.bean, cursor: "pointer", fontSize: 11, lineHeight: 1.4, fontFamily: "'Press Start 2P', monospace", padding: "17px 14px" }}
                    >
                      <span style={{ display: "inline-block", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}>
                        Notes
                      </span>
                    </button>
                    <button
                      onClick={() => setBrewStep(5)}
                      style={{ background: "none", border: `1px solid ${T.bean}`, borderRadius: D.folder.tabRadius, color: T.bean, cursor: "pointer", fontSize: 11, lineHeight: 1.4, fontFamily: "'Press Start 2P', monospace", padding: "17px 14px" }}
                    >
                      <span style={{ display: "inline-block", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}>
                        Sensory Web
                      </span>
                    </button>
                  </div>
                </div>
              ) : brewStep === 5 ? (
                <TastingRadar scores={tasting} onChange={setTasting} />
              ) : brewStep === 6 ? (
                <div>
                  <textarea
                    value={notes}
                    onChange={(e) => setNotes(e.target.value)}
                    style={{ width: "100%", height: 250, boxSizing: "border-box", padding: "10px 12px", border: `1px solid ${T.line}`, borderRadius: 0, background: "#FFFFFF", fontFamily: "'VT323', monospace", fontSize: 18, lineHeight: 1.45, color: T.ink, resize: "vertical" }}
                  />
                </div>
              ) : brewStep === 3 ? (
                <div>
                  {/* Dose / ratio / water — edit any one, the others follow */}
                  <div style={{ display: "flex", flexWrap: "wrap", alignItems: "flex-end", gap: 14, marginBottom: 6 }}>
                    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                      <span style={recipeLabel}>Coffee (g)</span>
                      <input type="number" min="0" step="0.1" value={recipe.dose} onChange={setRecipeField("dose")} placeholder="18" style={recipeInput} />
                    </label>
                    <span style={{ fontSize: 20, color: T.muted, paddingBottom: 6 }}>×</span>
                    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                      <span style={recipeLabel}>Ratio 1:</span>
                      <input type="number" min="0" step="0.1" value={recipe.ratio} onChange={setRecipeField("ratio")} placeholder="16" style={recipeInput} />
                    </label>
                    <span style={{ fontSize: 20, color: T.muted, paddingBottom: 6 }}>=</span>
                    <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                      <span style={recipeLabel}>{brewMethod === "espresso" ? "Yield (g)" : "Water (g)"}</span>
                      <input type="number" min="0" step="1" value={recipe.water} onChange={setRecipeField("water")} placeholder="288" style={{ ...recipeInput, borderColor: T.bean, color: T.bean }} />
                    </label>
                  </div>
                  <p style={{ fontSize: 15, color: T.muted, margin: "0 0 6px", letterSpacing: "0.04em" }}>
                    Edit any field — the other two follow.
                  </p>
                  {(() => {
                    const bag = bags.find((b) => b.id === brewPick);
                    const left = bag ? remainingGrams(bag, brews) : null;
                    const dose = num(recipe.dose);
                    if (left === null || !dose) return <div style={{ marginBottom: 16 }} />;
                    const over = dose > left;
                    return (
                      <p style={{ fontSize: 17, color: over ? T.rust : T.inkSoft, margin: "0 0 16px", letterSpacing: "0.04em" }}>
                        {over
                          ? `Only ${Math.round(left)} g left in this bag.`
                          : `${Math.round(left)} g in bag → ${Math.round(left - dose)} g after this brew.`}
                      </p>
                    );
                  })()}

                  {/* Pourover + ORB: pour structure */}
                  {brewMethod !== "espresso" && (
                    <>
                      <div style={{ ...recipeLabel, marginBottom: 8 }}>Pour structure</div>
                      {recipe.pours.map((pour, i) => (
                        <div key={i} style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 6, marginBottom: 8, fontSize: 17, color: T.inkSoft, lineHeight: 1.4 }}>
                          <span>Pour</span>
                          <input type="number" min="0" step="1" value={pour.to} onChange={setPour(i, "to")} placeholder={i === 0 && num(recipe.dose) ? String(Math.round(num(recipe.dose) * 2)) : ""} style={{ ...recipeInput, width: 54 }} />
                          {i === 0 ? (
                            <>
                              <span>g of water and bloom for</span>
                              <input type="number" min="0" step="1" value={pour.sec} onChange={setPour(i, "sec")} placeholder="45" style={{ ...recipeInput, width: 48 }} />
                              <span>seconds</span>
                            </>
                          ) : (
                            <span>g of water</span>
                          )}
                          {recipe.pours.length > 1 && (
                            <button onClick={() => removePour(i)} title="Remove pour" style={{ background: "none", border: "none", color: T.muted, cursor: "pointer", fontSize: 16, fontFamily: "'VT323', monospace", padding: "0 4px" }}>✕</button>
                          )}
                        </div>
                      ))}
                      <button
                        onClick={addPour}
                        disabled={waterTarget > 0 && remaining <= 0}
                        style={{ background: "none", border: `1px solid ${remaining > 0 || !waterTarget ? T.bean : T.line}`, borderRadius: D.folder.tabRadius, color: remaining > 0 || !waterTarget ? T.bean : T.muted, cursor: remaining > 0 || !waterTarget ? "pointer" : "not-allowed", fontSize: 10, fontFamily: "'Press Start 2P', monospace", padding: "7px 10px", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
                      >
                        + Add pour
                      </button>
                      {waterTarget > 0 && (
                        <div style={{ fontSize: 17, color: remaining > 0 ? T.inkSoft : T.bean, letterSpacing: "0.04em", marginTop: 10 }}>
                          {remaining > 0
                            ? `${remaining} g of water remaining out of ${Math.round(waterTarget)} g`
                            : `All ${Math.round(waterTarget)} g of water poured`}
                        </div>
                      )}
                      <div style={{ marginBottom: 18 }} />

                      <label style={{ display: "flex", flexDirection: "column", gap: 4, width: 120 }}>
                        <span style={recipeLabel}>Total brew time</span>
                        <input value={recipe.tbt} onChange={setRecipeField("tbt")} placeholder="MM:SS" style={{ ...recipeInput, width: 90 }} />
                      </label>
                    </>
                  )}

                  {/* Espresso: pressure + shot time */}
                  {brewMethod === "espresso" && (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 14 }}>
                      <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                        <span style={recipeLabel}>Peak pressure (bar)</span>
                        <input type="number" min="0" step="0.1" value={recipe.pressure} onChange={setRecipeField("pressure")} placeholder="9" style={recipeInput} />
                      </label>
                      <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                        <span style={recipeLabel}>Brew time (sec)</span>
                        <input type="number" min="0" step="1" value={recipe.seconds} onChange={setRecipeField("seconds")} placeholder="28" style={recipeInput} />
                        {num(recipe.seconds) ? (
                          <span style={{ fontSize: 15, color: T.muted, textAlign: "center" }}>{fmtSeconds(recipe.seconds)}</span>
                        ) : null}
                      </label>
                    </div>
                  )}

                  {/* Gear — grinder, grind size, and dripper/brewer pulled from the Cabinet */}
                  <div style={{ marginTop: 20, paddingTop: 14, borderTop: `1px dashed ${T.line}` }}>
                    <div style={{ ...recipeLabel, marginBottom: 8 }}>Gear</div>
                    <div style={{ display: "flex", flexWrap: "wrap", alignItems: "flex-end", gap: 14 }}>
                      <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                        <span style={recipeLabel}>Grinder</span>
                        <select value={recipe.grinderId} onChange={setRecipeField("grinderId")} style={{ ...recipeInput, width: 172, textAlign: "left" }}>
                          <option value="">—</option>
                          {grinderOptions.map((g) => (
                            <option key={g.id} value={g.id}>{g.name}</option>
                          ))}
                        </select>
                      </label>
                      <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                        <span style={recipeLabel}>Grind size</span>
                        <input type="number" min="0" step="any" inputMode="decimal" value={recipe.grindSize} onChange={setRecipeField("grindSize")} placeholder="e.g. 3.2" style={recipeInput} />
                      </label>
                      <label style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                        <span style={recipeLabel}>Dripper / Brewer</span>
                        <select value={recipe.brewerId} onChange={setRecipeField("brewerId")} style={{ ...recipeInput, width: 172, textAlign: "left" }}>
                          <option value="">—</option>
                          {brewerOptions.map((g) => (
                            <option key={g.id} value={g.id}>{g.name}</option>
                          ))}
                        </select>
                      </label>
                    </div>
                    {gear.length === 0 && (
                      <p style={{ fontSize: 15, color: T.muted, margin: "8px 0 0", letterSpacing: "0.04em" }}>
                        Add grinders and brewers in the Cabinet to pick them here.
                      </p>
                    )}
                  </div>
                </div>
              ) : brewStep === 2 ? (
                <div style={{ display: "grid", gap: 8 }}>
                  {METHODS.map((m) => {
                    const picked = brewMethod === m.key;
                    return (
                      <div
                        key={m.key}
                        onClick={() => setBrewMethod(m.key)}
                        style={{
                          display: "flex", alignItems: "center", gap: 12, cursor: "pointer",
                          padding: "12px 14px",
                          background: picked ? "#E4E7D6" : "transparent",
                          border: `1px solid ${picked ? T.bean : T.line}`,
                          borderLeft: `4px solid ${picked ? T.bean : T.line}`,
                        }}
                      >
                        <PixelIcon name={m.key} cell={4} />
                        <span style={{ fontFamily: "'Press Start 2P', monospace", fontSize: 10, lineHeight: 1.4, color: picked ? T.ink : T.inkSoft, transform: `scaleY(${D.stretch.button})`, transformOrigin: "left center", display: "inline-block" }}>
                          {m.label}
                        </span>
                      </div>
                    );
                  })}
                </div>
              ) : brewableBags.length === 0 ? (
                <p style={{ color: T.inkSoft, fontSize: 18, margin: "12px 0" }}>
                  Nothing on the shelf — log or unarchive a bag first.
                </p>
              ) : (
                brewableBags.map((b) => {
                  const picked = brewPick === b.id;
                  const left = remainingGrams(b, brews);
                  const empty = left !== null && left <= 0;
                  return (
                    <div
                      key={b.id}
                      onClick={() => !empty && setBrewPick(b.id)}
                      style={{
                        display: "flex", alignItems: "center", gap: 8, cursor: empty ? "not-allowed" : "pointer",
                        padding: "9px 11px", marginBottom: 6,
                        opacity: empty ? 0.5 : 1,
                        background: picked ? "#E4E7D6" : "transparent",
                        border: `1px solid ${picked ? T.bean : T.line}`,
                        borderLeft: `4px solid ${picked ? T.bean : T.line}`,
                      }}
                    >
                      <span style={{ color: picked ? T.bean : T.muted, fontSize: 17, flexShrink: 0 }}>{picked ? "●" : "○"}</span>
                      <span style={{ minWidth: 0, flex: 1 }}>
                        <span style={{ display: "block", fontFamily: "'Press Start 2P', monospace", fontSize: 9, lineHeight: 1.3, color: T.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", transform: `scaleY(${D.stretch.button})`, transformOrigin: "left top" }}>
                          {b.roaster}
                        </span>
                        <span style={{ display: "block", fontSize: 16, lineHeight: 1.2, color: T.inkSoft, marginTop: 3 }}>
                          {[b.origin, b.processing].filter(Boolean).join(" · ") || "no details logged"}
                        </span>
                      </span>
                      <span style={{ fontSize: 15, color: T.muted, flexShrink: 0, textAlign: "right", letterSpacing: "0.04em", lineHeight: 1.2 }}>
                        {b.roastDate || "—"}
                        <span style={{ display: "block", color: left !== null && left <= 0 ? T.rust : T.inkSoft }}>
                          {left === null ? "" : left <= 0 ? "EMPTY" : `${Math.round(left)} g left`}
                        </span>
                      </span>
                    </div>
                  );
                })
              )}
            </div>

            {/* Same rule as under the title: 2px ink, inset to the card gutter. */}
            <div style={{ height: 2, background: T.ink, margin: "0 26px", flexShrink: 0 }} />
            <div style={{ padding: "12px 26px 20px", display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button
                onClick={() => {
                  if (brewStep === 1) closeBrewModal();
                  else if (brewStep === 4) closeBrewModal();          // "Later"
                  else if (brewStep === 5 || brewStep === 6) setBrewStep(4);  // back to the picker
                  else setBrewStep(brewStep - 1);
                }}
                style={{ background: "none", border: `1px solid ${T.line}`, borderRadius: D.folder.tabRadius, padding: "10px 18px", fontSize: 10, cursor: "pointer", color: T.inkSoft, fontFamily: "'Press Start 2P', monospace", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
              >
                {brewStep === 1 ? "Cancel" : brewStep === 4 ? "Later" : "Back"}
              </button>
              {/* No advance button on the picker: its two choices ARE the forward paths,
                  and a "Next" here would just be a third, unlabelled way into the web. */}
              {brewStep !== 4 && (
              <button
                className="ci-btn"
                onClick={() => {
                  if (brewStep === 3) addBrew();
                  else if (brewStep === 5) saveTasting();
                  else if (brewStep === 6) saveNotes();
                  else setBrewStep(brewStep + 1);
                }}
                disabled={!stepReady}
                style={{ background: stepReady ? T.bean : T.beanSoft, color: T.card, border: "none", borderRadius: D.folder.tabRadius, padding: "10px 20px", fontSize: 10, cursor: stepReady ? "pointer" : "not-allowed", fontFamily: "'Press Start 2P', monospace", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
              >
                {brewStep === 3 ? "Log brew" : brewStep === 5 ? "Save review" : brewStep === 6 ? "Save notes" : "Next"}
              </button>
              )}
            </div>
          </div>
        </div>
      )}

      {/* New-bag / edit-bag modal */}
      {showModal && (
        <div
          onClick={(e) => { if (e.target === e.currentTarget) closeModal(); }}
          style={{ position: "fixed", inset: 0, background: "rgba(43,33,24,0.45)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 50 }}
        >
          {/* No `overflow: hidden` here, unlike the other cards: this one scrolls itself and
              deliberately keeps overflowX visible for the date picker. */}
          <div style={{ background: T.card, borderRadius: D.folder.radius, width: "100%", maxWidth: 560, maxHeight: "90vh", overflowY: "auto", overflowX: "visible", border: `1px solid ${T.line}`, boxShadow: "6px 6px 0 rgba(43,33,24,0.55)" }}>
            <div style={{ padding: "20px 26px 16px" }}>
              <h2 style={{ fontFamily: "'Press Start 2P', monospace", fontWeight: 650, fontSize: 15, margin: 0, transform: `translateY(2px) scaleY(${D.stretch.button})`, transformOrigin: "left center", display: "inline-block" }}>{editingId ? "Edit Bag" : "New Bag"}</h2>
            </div>
            {/* Inset to the card gutter, so it reads as a rule under the title rather
                than a seam cutting the card edge to edge. */}
            <div style={{ height: 2, background: T.ink, margin: "0 26px", flexShrink: 0 }} />

            <div style={{ padding: "18px 26px", display: "grid", gridTemplateColumns: narrow ? "1fr" : "1fr 1fr", gap: "14px 16px", overflow: "visible" }}>
              {FIELDS.map((f) => (
                <label key={f.key} style={{ display: "flex", flexDirection: "column", gap: 5, gridColumn: f.key === "roaster" ? "1 / -1" : "auto", position: f.type === "date" ? "relative" : "static" }}>
                  <span style={{ fontFamily: "'VT323', monospace", fontSize: 14, letterSpacing: "0.06em", textTransform: "uppercase", color: T.inkSoft }}>
                    {f.label}{f.required && <span style={{ color: T.rust }}> *</span>}
                  </span>
                  {f.type === "date" ? (
                    <>
                      <button
                        type="button"
                        onClick={() => setCalOpen((v) => !v)}
                        style={{
                          padding: "10px 12px",
                          border: `1px solid ${calOpen ? T.bean : T.line}`,
                          borderRadius: 0,
                          background: "#FFFFFF",
                          fontFamily: "'VT323', monospace",
                          fontSize: 17,
                          color: form[f.key] ? T.ink : T.muted,
                          cursor: "pointer",
                          textAlign: "left",
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "space-between",
                          gap: 8,
                        }}
                      >
                        {form[f.key] || "pick a date"}
                        <span style={{ color: T.bean, fontSize: 15 }}>▦</span>
                      </button>
                      {calOpen && (
                        <PixelCalendar
                          value={form[f.key]}
                          onPick={(iso) => setForm((prev) => ({ ...prev, [f.key]: iso }))}
                          onClose={() => setCalOpen(false)}
                        />
                      )}
                    </>
                  ) : (
                    <input
                      type={f.type || "text"}
                      value={form[f.key]}
                      onChange={set(f.key)}
                      placeholder={f.placeholder || ""}
                      list={f.list ? "process-options" : undefined}
                      style={{ padding: "10px 12px", border: `1px solid ${T.line}`, borderRadius: 0, background: "#FFFFFF", fontFamily: "'VT323', monospace", fontSize: 17, color: T.ink }}
                    />
                  )}
                </label>
              ))}
              <datalist id="process-options">
                {PROCESS_OPTIONS.map((p) => <option key={p} value={p} />)}
              </datalist>
            </div>

            <div style={{ padding: "6px 26px 22px", display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button
                onClick={closeModal}
                style={{ background: "none", border: `1px solid ${T.line}`, borderRadius: D.folder.tabRadius, padding: "10px 18px", fontSize: 10, cursor: "pointer", color: T.inkSoft, fontFamily: "'Press Start 2P', monospace", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
              >
                Cancel
              </button>
              <button
                className="ci-btn"
                onClick={saveBag}
                disabled={!form.roaster.trim()}
                style={{ background: form.roaster.trim() ? T.bean : T.beanSoft, color: T.card, border: "none", borderRadius: D.folder.tabRadius, padding: "10px 20px", fontSize: 10, cursor: form.roaster.trim() ? "pointer" : "not-allowed", fontFamily: "'Press Start 2P', monospace", transform: `scaleY(${D.stretch.button})`, transformOrigin: "center" }}
              >
                {editingId ? "Save changes" : "Add to inventory"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// The boot placeholder inside #root is replaced by the first render.

ReactDOM.createRoot(document.getElementById("root")).render(<CoffeeInventory />);
</script>

</body>
